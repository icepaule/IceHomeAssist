<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IceFlightRadar</title>
<style>
  :root { --bg:#14171c; --panel:#1d2127; --line:#2c323b; --txt:#e6e9ee; --dim:#8b95a3; --ok:#3fb950; --warn:#d29922; --bad:#f85149; --acc:#4aa8ff; }
  * { box-sizing:border-box; }
  html,body { height:100%; margin:0; background:var(--bg); color:var(--txt); font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  body { display:flex; flex-direction:column; }
  header { display:flex; flex-wrap:wrap; gap:10px 18px; align-items:center; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { font-size:18px; margin:0 8px 0 0; }
  h1 span { color:var(--acc); }
  .stat { display:flex; flex-direction:column; min-width:74px; }
  .stat b { font-size:17px; font-variant-numeric:tabular-nums; }
  .stat small { color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.04em; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--bad); display:inline-block; margin-right:6px; }
  .dot.ok { background:var(--ok); } .dot.warn { background:var(--warn); }
  #updated { margin-left:auto; color:var(--dim); font-size:12px; }
  nav { display:flex; gap:2px; padding:0 12px; background:var(--panel); border-bottom:1px solid var(--line); overflow-x:auto; }
  nav button { background:none; border:0; color:var(--dim); padding:10px 16px; font:inherit; cursor:pointer; border-bottom:2px solid transparent; white-space:nowrap; }
  nav button.active { color:var(--txt); border-bottom-color:var(--acc); }
  nav a { color:var(--dim); padding:10px 16px; text-decoration:none; margin-left:auto; }
  main { flex:1; min-height:0; }
  iframe { width:100%; height:100%; border:0; background:#000; }
  @media (max-width:600px){ .stat { min-width:60px; } .stat b { font-size:15px; } }
</style>
</head>
<body>
<header>
  <h1>Ice<span>FlightRadar</span></h1>
  <div class="stat"><b><i class="dot" id="dot"></i><span id="s-state">-</span></b><small>Empfang</small></div>
  <div class="stat"><b id="s-total">-</b><small>Flugzeuge</small></div>
  <div class="stat"><b id="s-pos">-</b><small>mit Position</small></div>
  <div class="stat"><b id="s-msg">-</b><small>Nachr./min</small></div>
  <div class="stat"><b id="s-sig">-</b><small>Signal dBFS</small></div>
  <div class="stat"><b id="s-noise">-</b><small>Rauschen dBFS</small></div>
  <div class="stat"><b id="s-range">-</b><small>max. Distanz km</small></div>
  <div id="updated"></div>
</header>
<nav id="tabs"></nav>
<main><iframe id="frame" title="IceFlightRadar"></iframe></main>
<script>
(async function () {
  let cfg = {};
  try { cfg = await fetch('public.json', { cache: 'no-store' }).then(r => r.json()); } catch (e) {}
  const mapUrl = (location.protocol + '//' + location.hostname + ':8095/');
  const tabs = [
    { id: 'karte',    label: 'Karte',    url: mapUrl },
    { id: 'statistik',label: 'Statistik',url: mapUrl.replace(/\/?$/, '/') + 'graphs1090/' },
  ];
  if (cfg.adsbx_feed_id) tabs.push({ id: 'adsbx', label: 'ADSBExchange', url: 'https://www.adsbexchange.com/api/feeders/?feed=' + encodeURIComponent(cfg.adsbx_feed_id) });

  const nav = document.getElementById('tabs'), frame = document.getElementById('frame');
  function select(id) {
    const t = tabs.find(x => x.id === id) || tabs[0];
    frame.src = t.url;
    [...nav.querySelectorAll('button')].forEach(b => b.classList.toggle('active', b.dataset.id === t.id));
    history.replaceState(null, '', '#' + t.id);
  }
  tabs.forEach(t => { const b = document.createElement('button'); b.textContent = t.label; b.dataset.id = t.id; b.onclick = () => select(t.id); nav.appendChild(b); });
  const setup = document.createElement('a'); setup.href = '/config/'; setup.textContent = 'Konfiguration'; nav.appendChild(setup);
  select(location.hash.slice(1));

  const $ = id => document.getElementById(id);
  const fmt = (v, d = 0) => (v === undefined || v === null || isNaN(v)) ? '-' : Number(v).toFixed(d);
  async function refresh() {
    try {
      const [ac, st] = await Promise.all([fetch('data/aircraft.json', { cache: 'no-store' }).then(r => r.json()),
                                          fetch('data/stats.json', { cache: 'no-store' }).then(r => r.json())]);
      const list = ac.aircraft || [];
      const withPos = list.filter(a => a.lat !== undefined).length;
      const dists = list.map(a => a.r_dst).filter(x => x !== undefined);
      const l = st.last1min || {}, loc = l.local || {};
      const msgs = l.messages_valid;
      $('s-total').textContent = list.length;
      $('s-pos').textContent = withPos;
      $('s-msg').textContent = fmt(msgs);
      $('s-sig').textContent = fmt(loc.signal, 1);
      $('s-noise').textContent = fmt(loc.noise, 1);
      $('s-range').textContent = dists.length ? fmt(Math.max(...dists) * 1.852) : '-';
      const ok = msgs > 0;
      $('dot').className = 'dot ' + (ok ? 'ok' : 'warn');
      $('s-state').textContent = ok ? 'OK' : 'ruhig';
      $('updated').textContent = 'aktualisiert ' + new Date().toLocaleTimeString('de-DE');
    } catch (e) {
      $('dot').className = 'dot'; $('s-state').textContent = 'offline';
    }
  }
  refresh(); setInterval(refresh, Math.max(2, cfg.ui_refresh_s || 5) * 1000);
})();
</script>
</body>
</html>
