# Standalone-Weboberflaeche (Port 80): Startseite + gleiche Origin fuer die Status-Daten
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Statusdaten von readsb/tar1090 (gleiche Origin, kein CORS noetig)
    location /data/ {
        proxy_pass http://127.0.0.1:8095/data/;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store";
    }

    # Steuerdienst (127.0.0.1:8099): Konfigseite, WLAN-Einrichtung, oeffentliche Werte
    location /config/ { proxy_pass http://127.0.0.1:8099/config/; proxy_set_header Host $http_host; }
    location /setup/  { proxy_pass http://127.0.0.1:8099/setup/;  proxy_set_header Host $http_host; }
    location = /public.json { proxy_pass http://127.0.0.1:8099/public.json; }

    # Captive-Portal-Erkennung der Handys/Laptops -> Setup-Seite
    location ~ ^/(generate_204|gen_204|hotspot-detect\.html|library/test/success\.html|connecttest\.txt|ncsi\.txt|canonical\.html|success\.txt)$ {
        return 302 http://$host/setup/;
    }
}
