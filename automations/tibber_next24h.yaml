# Tibber Next 24h Price Automations
# Rewritten 2026-02-16 to use actual HACS tibber_prices entities
# (sensor.paule_*)
#
# NOTE: Template sensors for Tibber are in templates/energie_kosten.yaml
#       Input helpers & utility meters are in packages/tibber_helpers.yaml
#       The template sensors that were previously here have been consolidated
#       into energie_kosten.yaml to avoid duplication.

# Benachrichtigung bei sehr günstigen Preisen
- id: tibber_cheap_price_notification
  alias: "Tibber: Günstige Preise Benachrichtigung"
  description: "Benachrichtigt wenn Strompreis sehr günstig ist"
  trigger:
    - platform: state
      entity_id: sensor.tibber_price_level
      to: "very_cheap"
  condition:
    - condition: time
      after: "06:00:00"
      before: "22:00:00"
  action:
    - service: notify.notify
      data:
        title: "Tibber: Sehr günstiger Strom!"
        message: >
          Aktueller Preis: {{ states('sensor.tibber_current_price') }} €/kWh
          (Min: {{ states('sensor.tibber_gunstigster_preis_heute') }} ct/kWh)
  mode: single

# Benachrichtigung bei teuren Preisen
- id: tibber_expensive_price_notification
  alias: "Tibber: Teure Preise Warnung"
  description: "Warnt wenn Strompreis sehr teuer ist"
  trigger:
    - platform: state
      entity_id: sensor.tibber_price_level
      to: "very_expensive"
  condition:
    - condition: time
      after: "06:00:00"
      before: "22:00:00"
  action:
    - service: notify.notify
      data:
        title: "Tibber: Teurer Strom!"
        message: >
          Aktueller Preis: {{ states('sensor.tibber_current_price') }} €/kWh
          (Max: {{ states('sensor.tibber_teuerster_preis_heute') }} ct/kWh)
          Günstigere Zeiten: {{ states('sensor.tibber_cheapest_hours_text') }}
  mode: single

# Tägliche Zusammenfassung der günstigsten Stunden
- id: tibber_daily_forecast
  alias: "Tibber: Tägliche Preisvorhersage"
  description: "Sendet morgens die günstigsten Stunden des Tages"
  trigger:
    - platform: time
      at: "07:00:00"
  action:
    - service: notify.notify
      data:
        title: "Tibber Tagesvorhersage"
        message: >
          Günstigste Zeit: {{ states('sensor.tibber_cheapest_hours_text') }}
          Durchschnitt: {{ states('sensor.tibber_durchschnittspreis_heute') }} ct/kWh
          Min: {{ states('sensor.tibber_gunstigster_preis_heute') }} ct/kWh
          Max: {{ states('sensor.tibber_teuerster_preis_heute') }} ct/kWh
  mode: single
