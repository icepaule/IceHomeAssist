                data_generator: |
                  return (entity.attributes.series_generic || []).map(p => ({x:p.x, y:p.y, mac:p.mac, rssi:p.rssi, vendor:p.vendor}));

          - type: markdown
            content: |
              **Radar-Lesart**: Die Distanz vom Mittelpunkt entspricht
              der **Signalstärke** des Geräts:

              | Position | RSSI | Bedeutung |
              |---|---|---|
              | Zentrum | -30 dBm | direkt nebenan (1-2 m) |
              | Mittlerer Ring | -65 dBm | gleicher Raum (~5 m) |
              | Aussenring | -100 dBm | Rand der Reichweite |

              Die **Winkelposition** ist aus dem MAC-Hash abgeleitet
              (deterministisch — gleiches Gerät bleibt am gleichen Ort).
              ApexCharts kann nicht echt-polar; die Achsen sind
              kartesisch (-1.0 .. 1.0).

