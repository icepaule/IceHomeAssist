              | MAC | Kategorie | Vendor | RSSI | Pakete | Sek seit erst |
              |---|---|---|---|---|---|
              {%- for d in (state_attr('sensor.ubertooth_ble_monitor_ble_gerate_liste', 'devices') or [])[:20] %}
