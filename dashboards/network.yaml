              theme:
                mode: dark
              labels:
                - "Ch 37 (2402 MHz)"
                - "Ch 38 (2426 MHz)"
                - "Ch 39 (2480 MHz)"
              colors: ["#3b82f6", "#10b981", "#f59e0b"]
