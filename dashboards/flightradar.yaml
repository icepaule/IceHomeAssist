# =============================================================================
# IceFlightRadar Dashboard
# ADS-B Empfang via NooElec NESDR Nano 3 -> readsb + tar1090 (Ultrafeeder)
# Interaktive Live-Karte (Positionen, Routen, Trails, Details) wie ATC-Radar.
# Quelle: /opt/iceflightradar/docker-compose.yml auf NUC-HA
# =============================================================================
title: FlightRadar
views:
  - title: Karte
    path: karte
    icon: mdi:airplane
    type: panel
    cards:
      - type: iframe
        url: http://10.10.0.100:8095/
        aspect_ratio: 100%

  - title: Statistik
    path: statistik
    icon: mdi:chart-line
    type: panel
    cards:
      - type: iframe
        url: http://10.10.0.100:8095/graphs1090/
        aspect_ratio: 100%

  - title: ADSBExchange
    path: adsbexchange
    icon: mdi:upload-network
    type: panel
    cards:
      - type: iframe
        url: https://www.adsbexchange.com/api/feeders/?feed=DEINE_FEED_ID
        aspect_ratio: 100%

  - title: Werte
    path: werte
    icon: mdi:gauge
    cards:
      - type: entities
        title: Empfänger (per MQTT)
        entities:
          - entity: binary_sensor.iceflightradar_empfang_aktiv
          - entity: sensor.iceflightradar_flugzeuge
          - entity: sensor.iceflightradar_flugzeuge_mit_position
          - entity: sensor.iceflightradar_nachrichten_pro_minute
          - entity: sensor.iceflightradar_positionen_pro_minute
          - entity: sensor.iceflightradar_signalpegel
          - entity: sensor.iceflightradar_rauschpegel
          - entity: sensor.iceflightradar_maximale_distanz
          - entity: sensor.iceflightradar_naechstes_flugzeug
      - type: history-graph
        title: Flugzeuge und Nachrichten
        hours_to_show: 6
        entities:
          - entity: sensor.iceflightradar_flugzeuge
          - entity: sensor.iceflightradar_flugzeuge_mit_position
          - entity: sensor.iceflightradar_nachrichten_pro_minute
      - type: history-graph
        title: Signal und Rauschen
        hours_to_show: 6
        entities:
          - entity: sensor.iceflightradar_signalpegel
          - entity: sensor.iceflightradar_rauschpegel
