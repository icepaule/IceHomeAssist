# Räume Dashboard
#
# Ueberarbeitet 14.07.2026: Vorherige Version war groesstenteils Mockup-Inhalt
# ohne echte Hardware dahinter (Lichter/Klima/Bewegungsmelder pro Raum,
# 4-Zonen-Bewaesserung). Jetzt auf tatsaechlich vorhandene Geraete reduziert.
# Flur + Bewaesserung komplett entfernt (keine Hardware vorhanden).
#
# 30.08.2026: Auf ein eigenes View (Tab) pro HA-Area umgestellt (vorher eine
# einzige scrollende Seite mit allen Raeumen als Sections). Server-/Cloud-
# Monitoring (SynNAS, THW Muenchen Ost, granulare Tibber/Paule-Preisprognosen)
# bewusst NICHT in die Raum-Views uebernommen, obwohl teils per HA-Area
# dorthin getaggt - das gehoert in die bestehenden Spezial-Dashboards
# (System/Energie/THW), nicht in eine physische Raumansicht.
# Bekannte Area-Tag-Inkonsistenz (nicht angefasst): WLED2 ist als Area "az"
# getaggt, wird aber seit jeher im Wohnzimmer angezeigt - hier unveraendert
# im Wohnzimmer belassen.

title: Räume
views:
  # ===== WOHNZIMMER =====
  - title: Wohnzimmer
    path: wohnzimmer
    icon: mdi:sofa
    type: sections
    max_columns: 3
    sections:
      - type: grid
        title: "🛋️ Wohnzimmer"
        cards:
          - type: custom:mushroom-climate-card
            entity: climate.wz_heizkorper
            show_temperature_control: true
            collapsible_controls: true

          - type: custom:mushroom-entity-card
            entity: binary_sensor.terrassentur_door
            name: Terrassentuer
            icon: mdi:door

          - type: custom:mushroom-cover-card
            entity: cover.rollo_wohnzimmer_curtain
            name: Rollo
            show_position_control: true

          - type: custom:mushroom-light-card
            entity: light.dimmer_wz_light_1
            name: Dimmer
            show_brightness_control: true

          - type: custom:mushroom-light-card
            entity: light.led_welt_led_welt
            name: LED-Welt
            show_brightness_control: true

          - type: entities
            title: LED-Welt Szene
            entities:
              - entity: select.led_welt_led_welt_szene
                name: Szene

          - type: entities
            title: Steckdosen
            entities:
              - entity: switch.licht_wz_mss210_main_channel
                name: Licht (Meross)
              - entity: switch.smart_switch_2404269570533151080bc4e7ae03a0c0_outlet
                name: Steckdose

          - type: entities
            title: TV
            entities:
              - entity: media_player.tv_wohnzimmer
                name: Bravia
              - entity: media_player.kd_55xe8505_2
                name: Bravia (Cast)

          - type: entities
            title: Echo (Wohnzimmer)
            entities:
              - entity: media_player.marcus_echo_plus
                name: Echo Plus

          - type: entities
            title: Trinkbrunnen (Katze)
            entities:
              - entity: sensor.trinkbrunnen_purified_water
                name: Gefiltertes Wasser
              - entity: sensor.trinkbrunnen_filter_remaining
                name: Filter verbleibend
              - entity: binary_sensor.trinkbrunnen_water_lack_warning
                name: Wasser leer
              - entity: binary_sensor.trinkbrunnen_replace_filter
                name: Filter wechseln

          - type: entities
            title: Staubsauger
            entities:
              - entity: vacuum.willi_robby
                name: Willi Robby
              - entity: sensor.willi_robby_battery_level
                name: Akku
              - entity: vacuum.conga_1790
                name: Conga

      # ===== WOHNZIMMER - LUFTQUALITAET (Luft2) =====
      # 27.07.2026: Luft2 stand faelschlich als "Buero"-Sensor in der Karte unten
      # (Annahme "gleicher Raum wie Luft3" war falsch) - Luft2 steht tatsaechlich
      # im Wohnzimmer, HA-Area war bereits korrekt "living_room".
      - type: grid
        title: Wohnzimmer - Luftqualität (Luft2)
        cards:
          - type: entities
            title: Luft2
            show_header_toggle: false
            entities:
              - entity: sensor.luft2_sensor_luft2_temperatur
                name: Temperatur
              - entity: sensor.luft2_sensor_luft2_luftfeuchtigkeit
                name: Luftfeuchtigkeit
              - entity: sensor.luft2_sensor_luft2_luftqualitaet_ppm
                name: CO2 (äquiv.)
              - entity: sensor.luft2_sensor_luft2_luftqualitaet_bewertung
                name: Bewertung
          - type: custom:apexcharts-card
            header:
              title: Klima Wohnzimmer - Tag
              show: true
            graph_span: 24h
            yaxis:
              - id: temp
                decimals: 1
                apex_config:
                  title:
                    text: "°C"
              - id: pct
                opposite: true
                min: 0
                max: 100
                apex_config:
                  title:
                    text: "%"
            series:
              - entity: sensor.luft2_sensor_luft2_temperatur
                name: Temperatur
                yaxis_id: temp
                curve: smooth
                color: "#F44336"
              - entity: sensor.luft2_sensor_luft2_luftfeuchtigkeit
                name: Luftfeuchtigkeit
                yaxis_id: pct
                curve: smooth
                color: "#2196F3"
          - type: custom:apexcharts-card
            header:
              title: Klima Wohnzimmer - Monat
              show: true
            graph_span: 30d
            yaxis:
              - id: temp
                decimals: 1
                apex_config:
                  title:
                    text: "°C"
              - id: pct
                opposite: true
                min: 0
                max: 100
                apex_config:
                  title:
                    text: "%"
            series:
              - entity: sensor.luft2_sensor_luft2_temperatur
                name: Temperatur
                yaxis_id: temp
                curve: smooth
                color: "#F44336"
                group_by:
                  func: avg
                  duration: 2h
              - entity: sensor.luft2_sensor_luft2_luftfeuchtigkeit
                name: Luftfeuchtigkeit
                yaxis_id: pct
                curve: smooth
                color: "#2196F3"
                group_by:
                  func: avg
                  duration: 2h
          - type: custom:apexcharts-card
            header:
              title: CO2-äquiv. Wohnzimmer - Tag
              show: true
            graph_span: 24h
            yaxis:
              - id: ppm
                decimals: 0
                apex_config:
                  title:
                    text: "ppm"
            series:
              - entity: sensor.luft2_sensor_luft2_luftqualitaet_ppm
                name: CO2 (äquiv.)
                yaxis_id: ppm
                curve: smooth
                color: "#9C27B0"
          - type: custom:apexcharts-card
            header:
              title: CO2-äquiv. Wohnzimmer - Monat
              show: true
            graph_span: 30d
            yaxis:
              - id: ppm
                decimals: 0
                apex_config:
                  title:
                    text: "ppm"
            series:
              - entity: sensor.luft2_sensor_luft2_luftqualitaet_ppm
                name: CO2 (äquiv.)
                yaxis_id: ppm
                curve: smooth
                color: "#9C27B0"
                group_by:
                  func: avg
                  duration: 2h

