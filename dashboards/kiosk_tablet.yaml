# =============================================================================
# KIOSK TABLET DASHBOARD - Galaxy Tab Bedienkonsole
# =============================================================================
# URL: /lovelace-kiosk/home?kiosk (mit kiosk-mode)

title: Kiosk
views:
  - title: Home
    path: home
    icon: mdi:tablet-dashboard
    kiosk_mode:
      kiosk: true
    cards:
      # =============================================
      # KOPFZEILE: Uhrzeit, Datum, Wetter
      # =============================================
      - type: horizontal-stack
        cards:
          - type: markdown
            content: |
              # {{ now().strftime('%H:%M') }}
              {{ now().strftime('%A, %d. %B %Y') }}
          - type: weather-forecast
            entity: weather.forecast_home
            show_forecast: false

      # =============================================
      # WARNUNGEN (nur wenn aktiv)
      # =============================================
      # Gaswarner Heizungskeller (MQ-2, hoechste Prioritaet)
      - type: conditional
        conditions:
          - entity: binary_sensor.gasleck_heizungskeller
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: "Gasleck Heizungskeller!"
          secondary: "{{ states('sensor.luft4_sensor_luft4_luftqualitaet_ppm') }} ppm (Alarm ab 2000ppm)"
          icon: mdi:gas-cylinder
          icon_color: red
          tap_action:
            action: navigate
            navigation_path: /lovelace-heizung/heizung
          card_mod:
            style: |
              ha-card {
                background-color: rgba(244, 67, 54, 0.15) !important;
                border: 2px solid red !important;
              }

      - type: conditional
        conditions:
          - entity: sensor.nina_munchen_warnungen_anzahl
            state_not: "0"
        card:
          type: custom:mushroom-template-card
          primary: "{{ states('sensor.nina_munchen_warnung_aktuell') }}"
          secondary: "Schwere: {{ states('sensor.nina_munchen_warnung_schwere') }}"
          icon: mdi:alert
          icon_color: red
          tap_action:
            action: navigate
            navigation_path: /lovelace-wetter/warnungen

      # Vogelbad: neue Erkennung (blendet nach 90s automatisch aus)
      - type: conditional
        conditions:
          - condition: template
            value_template: >
              {% set s = states.sensor.vogelbad_letzte_erkennung %}
              {{ s is not none and s.state not in ['unknown','unavailable',''] and (as_timestamp(now()) - as_timestamp(s.last_changed)) < 90 }}
        card:
          type: custom:mushroom-template-card
          primary: "Neuer Vogel: {{ states('sensor.vogelbad_letzte_erkennung') }}"
          secondary: "{{ state_attr('sensor.vogelbad_letzte_erkennung', 'lateinisch') }}"
          icon: mdi:bird
          icon_color: green
          tap_action:
            action: navigate
            navigation_path: /lovelace-vogelbad/historie
          card_mod:
            style: |
              ha-card {
                background-color: rgba(76, 175, 80, 0.15) !important;
                border: 2px solid green !important;
              }

      # Strompreis-Hinweis
      - type: conditional
        conditions:
          - entity: sensor.tibber_preis_status
            state: "günstig"
        card:
          type: custom:mushroom-template-card
          primary: "Strom gerade günstig: {{ states('sensor.tibber_preis_aktuell') }} ct/kWh"
          secondary: "Guter Zeitpunkt für Waschmaschine oder Trockner"
          icon: mdi:flash
          icon_color: green

      # =============================================
      # PETKIT WARNUNGEN (nur wenn Handlung nötig)
      # =============================================
      # Integration offline
      - type: conditional
        conditions:
          - entity: sensor.freddy_shitkit_state_2
            state: "unavailable"
        card:
          type: custom:mushroom-template-card
          primary: "Petkit offline!"
          secondary: "Katzenklo & Trinkbrunnen nicht erreichbar"
          icon: mdi:cat
          icon_color: red
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 165, 0, 0.15) !important;
                border: 2px solid orange !important;
              }

      # Katzenklo: Abfallbehälter voll
      - type: conditional
        conditions:
          - entity: binary_sensor.freddy_shitkit_wastebin_filled
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: "Katzenklo leeren!"
          secondary: "Abfallbehälter von Freddy ShitKit ist voll"
          icon: mdi:delete-alert
          icon_color: red
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 0, 0, 0.15) !important;
                border: 2px solid red !important;
                animation: pulse 2s infinite;
              }
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }

      # =============================================
      # ROBOROCK WARNUNG (Robby, S7 Max Ultra)
      # =============================================
      # Sauger-Fehler (z.B. Räder blockiert, Wassertank fehlt)
      - type: conditional
        conditions:
          - entity: sensor.s7_max_ultra_vacuum_error
            state_not: "none"
          - entity: sensor.s7_max_ultra_vacuum_error
            state_not: "unavailable"
        card:
          type: custom:mushroom-template-card
          primary: "Robby: Fehler"
          secondary: "{{ states('sensor.s7_max_ultra_vacuum_error') }}"
          icon: mdi:robot-vacuum-alert
          icon_color: red
          tap_action:
            action: navigate
            navigation_path: /lovelace-vacuum/erdgeschoss
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 0, 0, 0.15) !important;
                border: 2px solid red !important;
              }

      # Dock-Fehler (z.B. Reinwassertank leer/prüfen)
      - type: conditional
        conditions:
          - entity: sensor.s7_max_ultra_dock_dock_error
            state_not: "ok"
          - entity: sensor.s7_max_ultra_dock_dock_error
            state_not: "unavailable"
        card:
          type: custom:mushroom-template-card
          primary: "Robby: Dockstation"
          secondary: "{{ states('sensor.s7_max_ultra_dock_dock_error') }}"
          icon: mdi:robot-vacuum-alert
          icon_color: red
          tap_action:
            action: navigate
            navigation_path: /lovelace-vacuum/erdgeschoss
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 0, 0, 0.15) !important;
                border: 2px solid red !important;
              }

      # =============================================
      # DREAME WARNUNG (Willi)
      # =============================================
      - type: conditional
        conditions:
          - entity: sensor.willi_robby_error
            state_not: "no_error"
          - entity: sensor.willi_robby_error
            state_not: "unavailable"
        card:
          type: custom:mushroom-template-card
          primary: "Willi: Fehler"
          secondary: "{{ states('sensor.willi_robby_error') }}"
          icon: mdi:robot-vacuum-alert
          icon_color: red
          tap_action:
            action: navigate
            navigation_path: /lovelace-vacuum/staubsauger
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 0, 0, 0.15) !important;
                border: 2px solid red !important;
              }

      # =============================================
      # BEWERBUNGSASSISTENT
      # =============================================
      # Neue Stellentreffer der letzten 24h (Information, kein Alarm)
      - type: conditional
        conditions:
          - entity: sensor.bewerbung_neue_treffer_24h
            state_not: "0"
          - entity: sensor.bewerbung_neue_treffer_24h
            state_not: "unavailable"
          - entity: sensor.bewerbung_neue_treffer_24h
            state_not: "unknown"
        card:
          type: custom:mushroom-template-card
          primary: "{{ states('sensor.bewerbung_neue_treffer_text') }} für Gabriele"
          secondary: "{{ states('sensor.bewerbung_neue_treffer_kurz') }}"
          icon: mdi:briefcase-search
          icon_color: blue
          tap_action:
            action: navigate
            navigation_path: /lovelace-bewerbung/home
          card_mod:
            style: |
              ha-card {
                background-color: rgba(33, 150, 243, 0.12) !important;
                border: 2px solid #2196f3 !important;
              }

      # Bewerbungsassistent gestoert (Ollama, Mail-Import oder RSS)
      - type: conditional
        conditions:
          - entity: binary_sensor.bewerbungsassistent_problem
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: "Bewerbungsassistent gestört"
          secondary: "{{ states('sensor.bewerbung_stoerungstext') }}"
          icon: mdi:briefcase-remove
          icon_color: orange
          tap_action:
            action: navigate
            navigation_path: /lovelace-bewerbung/home
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 165, 0, 0.15) !important;
                border: 2px solid orange !important;
              }

      # Katzenklo: Streu niedrig
      - type: conditional
        conditions:
          - entity: binary_sensor.freddy_shitkit_sand_lack
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: "Katzenstreu nachfüllen!"
          secondary: >
            Streu in Freddy ShitKit ist niedrig
            {% if states('sensor.freddy_shitkit_litter_level_2') != 'unavailable' %}
            ({{ states('sensor.freddy_shitkit_litter_level_2') }}%)
            {% endif %}
          icon: mdi:grain
          icon_color: orange
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 165, 0, 0.15) !important;
                border: 2px solid orange !important;
              }

      # Katzenklo: Fehler / steckengeblieben
      - type: custom:mushroom-template-card
        primary: "Katzenklo Störung!"
        secondary: >
          {% set err = states('sensor.freddy_shitkit_error_2') %}
          {% set st = states('sensor.freddy_shitkit_state_2') %}
          {% if 'system_error' in st %}Reinigung gestoppt - Systemfehler
          {% elif 'paused' in st and 'pet' not in st %}Reinigung blockiert ({{ st | replace('_', ' ') }})
          {% elif err != 'no_error' and err != 'unavailable' and err != 'No error' %}Fehler: {{ err }}
          {% else %}Katzenklo prüfen!
          {% endif %}
        icon: mdi:alert-octagon
        icon_color: red
        card_mod:
          style: |
            ha-card {
              {% set err = states('sensor.freddy_shitkit_error_2') %}
              {% set st = states('sensor.freddy_shitkit_state_2') %}
              {% if ('system_error' in st) or ('paused' in st and 'pet' not in st and st != 'idle') or (err not in ['no_error', 'unavailable', 'unknown', 'No error']) %}
              background-color: rgba(255, 0, 0, 0.15) !important;
              border: 2px solid red !important;
              animation: pulse 2s infinite;
              {% else %}
              display: none !important;
              {% endif %}
            }
            @keyframes pulse {
              0%, 100% { opacity: 1; }
              50% { opacity: 0.7; }
            }

      # Trinkbrunnen: Wasser niedrig
      - type: conditional
        conditions:
          - entity: binary_sensor.trinkbrunnen_water_lack_warning
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: "Trinkbrunnen nachfüllen!"
          secondary: "Wasserstand im Trinkbrunnen ist niedrig"
          icon: mdi:water-alert
          icon_color: orange
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 165, 0, 0.15) !important;
                border: 2px solid orange !important;
              }

      # =============================================
      # GESCHIRRSPÜLER WARNUNGEN (nur wenn Handlung nötig)
      # =============================================
      # Spüler offline
      - type: conditional
        conditions:
          - entity: binary_sensor.spuler_online
            state: "off"
        card:
          type: custom:mushroom-template-card
          primary: "Spüler offline!"
          secondary: "Geschirrspüler nicht über Home Connect erreichbar"
          icon: mdi:dishwasher-off
          icon_color: orange
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 165, 0, 0.15) !important;
                border: 2px solid orange !important;
              }

      # Spüler fertig - Erinnerung Ausräumen
      - type: conditional
        conditions:
          - entity: binary_sensor.spuler_fertig
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: "Spüler ausräumen"
          secondary: >
            Programm fertig — bitte Geschirr ausräumen
            ({{ states('sensor.spuler_energie_prognose') }} kWh /
             {{ states('sensor.spuler_wasser_prognose') }} L verbraucht)
          icon: mdi:dishwasher-alert
          icon_color: blue
          card_mod:
            style: |
              ha-card {
                background-color: rgba(33, 150, 243, 0.15) !important;
                border: 2px solid #2196F3 !important;
              }

      # Spüler Fehler / Aktion nötig
      - type: conditional
        conditions:
          - entity: binary_sensor.spuler_fehler
            state: "on"
        card:
          type: custom:mushroom-template-card
          primary: "Spüler Störung!"
          secondary: >
            {{ states('sensor.spuler_status') }} — am Gerät prüfen
            (Tür, Wasser, Filter)
          icon: mdi:alert-octagon
          icon_color: red
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 0, 0, 0.15) !important;
                border: 2px solid red !important;
                animation: pulse 2s infinite;
              }
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }

      # =============================================
      # ENERGIE ÜBERSICHT
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: "Strom {{ states('sensor.tibber_preis_aktuell') }} ct"
            secondary: "{{ states('sensor.tibber_preis_status') }}"
            icon: mdi:currency-eur
            icon_color: >
              {% set s = states('sensor.tibber_preis_status') %}
              {% if s == 'günstig' %}green
              {% elif s == 'teuer' %}red
              {% else %}orange{% endif %}
            tap_action:
              action: navigate
              navigation_path: /lovelace-energie/preise
          - type: custom:mushroom-template-card
            primary: "PV {{ states('sensor.pv_leistung') }} W"
            secondary: "Netz {{ states('sensor.tibber_pulse_paule_power') }} W"
            icon: mdi:solar-power
            icon_color: yellow
            tap_action:
              action: navigate
              navigation_path: /lovelace-energie/pv
          - type: custom:mushroom-template-card
            primary: "Heute {{ states('sensor.stromkosten_heute') }} €"
            secondary: >
              {% set pv = states('sensor.pv_leistung')|float(0) %}
              {% if pv > 0 %}Einspeisung{% else %}—{% endif %}
            icon: mdi:cash-multiple
            icon_color: green
            tap_action:
              action: navigate
              navigation_path: /lovelace-energie/preise


      # =============================================
      # SONG-INFO (Hitster-Training)
      # =============================================
      - type: conditional
        conditions:
          - entity: sensor.aktueller_song
            state_not: "unknown"
          - entity: sensor.aktueller_song
            state_not: "unavailable"
        card:
          type: vertical-stack
          cards:
            - type: custom:mushroom-template-card
              primary: "{{ states('sensor.aktueller_song') }}"
              secondary: "{{ state_attr('sensor.aktueller_song', 'source') }}"
              icon: mdi:music-note
              icon_color: purple
            - type: markdown
              content: "**Song-Ansage** ein/aus je Alexa:"
              card_mod:
                style: |
                  ha-card {
                    background: none;
                    box-shadow: none;
                    padding: 0 0 0 8px !important;
                    margin: -8px 0 -12px 0;
                    font-size: 0.85em;
                    opacity: 0.7;
                  }
            - type: horizontal-stack
              cards:
                - type: custom:mushroom-entity-card
                  entity: input_boolean.song_info_echo_show
                  name: Show
                  icon: mdi:tablet
                  layout: horizontal
                  fill_container: true
                  tap_action:
                    action: toggle
                - type: custom:mushroom-entity-card
                  entity: input_boolean.song_info_echo_dot
                  name: Dot
                  icon: mdi:circle-small
                  layout: horizontal
                  fill_container: true
                  tap_action:
                    action: toggle
                - type: custom:mushroom-entity-card
                  entity: input_boolean.song_info_echo_plus
                  name: Plus
                  icon: mdi:speaker
                  layout: horizontal
                  fill_container: true
                  tap_action:
                    action: toggle
      # =============================================
      # SCHNELLSCHALTER
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-light-card
            entity: light.wled2
            name: WLED
            layout: vertical
            fill_container: true
          - type: custom:mushroom-entity-card
            entity: switch.licht_wz_mss210_main_channel
            name: Licht WZ
            icon: mdi:lightbulb
            layout: vertical
            fill_container: true
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: switch.strom_arbeitszimmer
            name: Büro
            icon: mdi:desk-lamp
            layout: vertical
            fill_container: true
            tap_action:
              action: toggle
          - type: custom:mushroom-entity-card
            entity: media_player.kd_55xe8505
            name: TV
            icon: mdi:television
            layout: vertical
            fill_container: true
            tap_action:
              action: toggle

      # =============================================
      # STAUBSAUGER
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: >
              Sauger — {{ states('sensor.willi_robby_status') }}
            secondary: >
              Akku {{ states('sensor.willi_robby_battery_level') }}%
            icon: mdi:robot-vacuum
            icon_color: >
              {% set s = states('vacuum.willi_robby') %}
              {% if s == 'cleaning' %}green
              {% elif s == 'returning' %}blue
              {% elif s == 'paused' %}orange
              {% elif s == 'docked' %}grey
              {% elif s == 'error' %}red
              {% else %}orange{% endif %}
            tap_action:
              action: navigate
              navigation_path: /lovelace-vacuum/staubsauger
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: action
                icon: mdi:play
                tap_action:
                  action: call-service
                  service: vacuum.start
                  target:
                    entity_id: vacuum.willi_robby
              - type: action
                icon: mdi:pause
                tap_action:
                  action: call-service
                  service: vacuum.pause
                  target:
                    entity_id: vacuum.willi_robby
              - type: action
                icon: mdi:stop
                tap_action:
                  action: call-service
                  service: vacuum.stop
                  target:
                    entity_id: vacuum.willi_robby
              - type: action
                icon: mdi:home
                tap_action:
                  action: call-service
                  service: vacuum.return_to_base
                  target:
                    entity_id: vacuum.willi_robby

      # =============================================
      # SPÜLMASCHINE (Tibber-Farbe: cheap/normal/expensive)
      # =============================================
      - type: vertical-stack
        cards:
          - type: custom:mushroom-template-card
            entity: sensor.spuler_status
            primary: >-
              {%- set s = states('sensor.spuler_status') -%}
              {%- set rest = states('sensor.spuler_restzeit') -%}
              Spüler — {{ s }}
              {%- if is_state('binary_sensor.spuler_lauft','on') and rest not in ['—','unknown','unavailable'] %} · {{ rest }} h{% endif %}
            secondary: >-
              {%- set p = states('sensor.spuler_programm') -%}
              {%- set k = states('sensor.spuler_kosten_aktueller_lauf') -%}
              {%- set tp = states('sensor.tibber_preis_aktuell') -%}
              {%- if is_state('binary_sensor.spuler_lauft','on') -%}
                {{ p }} · {{ k }} € · Strom {{ tp }} ct
              {%- elif is_state('binary_sensor.spuler_fertig','on') -%}
                Fertig — ausräumen! ({{ k }} €)
              {%- else -%}
                Strom {{ tp }} ct/kWh
              {%- endif %}
            icon: >-
              {%- set s = states('sensor.spuler_status') -%}
              {%- if s == 'Fertig' -%}mdi:dishwasher-alert
              {%- elif s in ['Fehler','Aktion nötig'] -%}mdi:alert-circle
              {%- elif is_state('binary_sensor.spuler_lauft','on') -%}mdi:dishwasher
              {%- else -%}mdi:dishwasher-off
              {%- endif %}
            icon_color: >-
              {%- set t = states('sensor.paule_current_hour_price_level') -%}
              {%- if t in ['cheap','very_cheap'] -%}green
              {%- elif t in ['expensive','very_expensive'] -%}red
              {%- else -%}orange
              {%- endif %}
            tap_action:
              action: navigate
              navigation_path: /lovelace-spuelmaschine/spuler
            card_mod:
              style: |
                ha-card {
                  {% set t = states('sensor.paule_current_hour_price_level') %}
                  {% if t in ['cheap','very_cheap'] %}
                    background-color: rgba(76, 175, 80, 0.15) !important;
                    border: 2px solid #4caf50 !important;
                  {% elif t in ['expensive','very_expensive'] %}
                    background-color: rgba(244, 67, 54, 0.15) !important;
                    border: 2px solid #f44336 !important;
                  {% else %}
                    background-color: rgba(255, 152, 0, 0.15) !important;
                    border: 2px solid #ff9800 !important;
                  {% endif %}
                }

          # Programm-Kosten-Kacheln (Zeile 1)
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: input_number.dishwasher_kwh_eco50
                primary: >-
                  {{ ((states('input_number.dishwasher_kwh_eco50')|float(0))
                     * (states('sensor.tibber_current_price_2')|float(0))) | round(2) }} €
                secondary: "Eco 50°"
                icon: mdi:leaf
                icon_color: green
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-spuelmaschine/spuler
              - type: custom:mushroom-template-card
                entity: input_number.dishwasher_kwh_auto
                primary: >-
                  {{ ((states('input_number.dishwasher_kwh_auto')|float(0))
                     * (states('sensor.tibber_current_price_2')|float(0))) | round(2) }} €
                secondary: "Auto 45-65°"
                icon: mdi:auto-mode
                icon_color: blue
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-spuelmaschine/spuler
              - type: custom:mushroom-template-card
                entity: input_number.dishwasher_kwh_speed65
                primary: >-
                  {{ ((states('input_number.dishwasher_kwh_speed65')|float(0))
                     * (states('sensor.tibber_current_price_2')|float(0))) | round(2) }} €
                secondary: "Speed 65°"
                icon: mdi:run-fast
                icon_color: cyan
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-spuelmaschine/spuler
              - type: custom:mushroom-template-card
                entity: input_number.dishwasher_kwh_intensiv70
                primary: >-
                  {{ ((states('input_number.dishwasher_kwh_intensiv70')|float(0))
                     * (states('sensor.tibber_current_price_2')|float(0))) | round(2) }} €
                secondary: "Intensiv 70°"
                icon: mdi:fire
                icon_color: red
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-spuelmaschine/spuler
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                entity: input_number.dishwasher_kwh_quick45
                primary: >-
                  {{ ((states('input_number.dishwasher_kwh_quick45')|float(0))
                     * (states('sensor.tibber_current_price_2')|float(0))) | round(2) }} €
                secondary: "Quick 45°"
                icon: mdi:fast-forward
                icon_color: amber
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-spuelmaschine/spuler
              - type: custom:mushroom-template-card
                entity: input_number.dishwasher_kwh_glas40
                primary: >-
                  {{ ((states('input_number.dishwasher_kwh_glas40')|float(0))
                     * (states('sensor.tibber_current_price_2')|float(0))) | round(2) }} €
                secondary: "Glas 40°"
                icon: mdi:glass-tulip
                icon_color: teal
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-spuelmaschine/spuler
              - type: custom:mushroom-template-card
                entity: input_number.dishwasher_kwh_night
                primary: >-
                  {{ ((states('input_number.dishwasher_kwh_night')|float(0))
                     * (states('sensor.tibber_current_price_2')|float(0))) | round(2) }} €
                secondary: "Nacht"
                icon: mdi:weather-night
                icon_color: indigo
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-spuelmaschine/spuler
              - type: custom:mushroom-template-card
                entity: input_number.dishwasher_kwh_prerinse
                primary: >-
                  {{ ((states('input_number.dishwasher_kwh_prerinse')|float(0))
                     * (states('sensor.tibber_current_price_2')|float(0))) | round(2) }} €
                secondary: "Vorspülen"
                icon: mdi:water
                icon_color: blue-grey
                layout: vertical
                tap_action:
                  action: navigate
                  navigation_path: /lovelace-spuelmaschine/spuler

          # =============================================
      # PETKIT STATUS (Katzenklo & Trinkbrunnen)
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: >
              {% set st = states('sensor.freddy_shitkit_state_2') %}
              {% set wb = states('binary_sensor.freddy_shitkit_wastebin_filled') %}
              {% if st == 'unavailable' %}Klo — Offline
              {% elif wb == 'on' %}Klo — Leeren!
              {% elif st == 'idle' %}Klo — OK
              {% else %}Klo — {{ st | replace('_',' ') | truncate(12) }}{% endif %}
            secondary: >
              {% set lvl = states('sensor.freddy_shitkit_litter_level_2') %}
              {% if lvl != 'unavailable' %}Streu {{ lvl }}%{% endif %}
            icon: mdi:cat
            icon_color: >
              {% set wastebin = states('binary_sensor.freddy_shitkit_wastebin_filled') %}
              {% set litter = states('binary_sensor.freddy_shitkit_sand_lack') %}
              {% set state = states('sensor.freddy_shitkit_state_2') %}
              {% if wastebin == 'on' %}red
              {% elif litter == 'on' %}orange
              {% elif state == 'unavailable' %}grey
              {% else %}green{% endif %}
          - type: custom:mushroom-template-card
            primary: >
              {% set w = states('binary_sensor.trinkbrunnen_water_lack_warning') %}
              {% if w == 'unavailable' %}Brunnen — Offline
              {% elif w == 'on' %}Brunnen — Leer!
              {% else %}Brunnen — OK{% endif %}
            secondary: >
              {% set f = states('sensor.trinkbrunnen_filter_remaining') %}
              {% if f != 'unavailable' %}Filter {{ f }}%{% endif %}
            icon: mdi:cup-water
            icon_color: >
              {% set water = states('binary_sensor.trinkbrunnen_water_lack_warning') %}
              {% if water == 'on' %}orange
              {% elif water == 'unavailable' %}grey
              {% else %}cyan{% endif %}
          - type: custom:mushroom-template-card
            primary: >
              {% set w = states('sensor.freddy_last_weight_measurement') %}
              Freddy{% if w != 'unavailable' %} {{ w }}kg{% endif %}
            secondary: >
              {% set d = states('sensor.freddy_last_use_duration_2') %}
              {% if d != 'unavailable' %}Letzte: {{ d }}s{% else %}—{% endif %}
            icon: mdi:paw
            icon_color: >
              {% if states('sensor.freddy_last_weight_measurement') == 'unavailable' %}grey{% else %}teal{% endif %}

      # =============================================
      # WASCHRAUM & KÜCHE
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: "Waschen {{ states('sensor.waschmaschine_leistung') }}W"
            secondary: >
              {% if states('sensor.waschmaschine_leistung')|float(0) > 10 %}Läuft{% else %}Aus{% endif %}
            icon: mdi:washing-machine
            icon_color: >
              {% if states('sensor.waschmaschine_leistung')|float(0) > 10 %}green{% else %}grey{% endif %}
          - type: custom:mushroom-template-card
            primary: "Trockner {{ states('sensor.trockner_leistung') }}W"
            secondary: >
              {% if states('sensor.trockner_leistung')|float(0) > 10 %}Läuft{% else %}Aus{% endif %}
            icon: mdi:tumble-dryer
            icon_color: >
              {% if states('sensor.trockner_leistung')|float(0) > 10 %}green{% else %}grey{% endif %}
          - type: custom:mushroom-template-card
            primary: >
              {% set s = states('sensor.spuler_status') %}
              {% if s == 'Läuft' %}Spüler läuft
              {% elif s == 'Fertig' %}Spüler fertig
              {% elif s in ['Fehler','Aktion nötig','Abgebrochen'] %}Spüler {{ s }}
              {% elif s == 'Verzögerter Start' %}Spüler wartet
              {% else %}Spüler {{ s }}{% endif %}
            secondary: >
              {% set s = states('sensor.spuler_status') %}
              {% set p = states('sensor.spuler_programm') %}
              {% if s == 'Läuft' %}{{ p }} • {{ states('sensor.spuler_energie_prognose') }} kWh
              {% elif s == 'Fertig' %}Ausräumen!
              {% elif p not in ['—','unknown','unavailable'] %}{{ p }}
              {% else %}—{% endif %}
            icon: >
              {% set s = states('sensor.spuler_status') %}
              {% if s == 'Fertig' %}mdi:dishwasher-alert
              {% elif s in ['Fehler','Aktion nötig'] %}mdi:alert-circle
              {% else %}mdi:dishwasher{% endif %}
            icon_color: >
              {% set s = states('sensor.spuler_status') %}
              {% if s == 'Läuft' %}green
              {% elif s == 'Fertig' %}blue
              {% elif s in ['Fehler','Aktion nötig','Abgebrochen'] %}red
              {% elif s == 'Verzögerter Start' %}orange
              {% else %}grey{% endif %}
            tap_action:
              action: more-info
              entity: sensor.spuler_status
          - type: custom:mushroom-template-card
            primary: "Küche {{ states('sensor.kueche_leistung') }}W"
            secondary: >
              {% if states('sensor.kueche_leistung')|float(0) > 10 %}Aktiv{% else %}Aus{% endif %}
            icon: mdi:countertop
            icon_color: >
              {% if states('sensor.kueche_leistung')|float(0) > 10 %}green{% else %}grey{% endif %}

      # =============================================
      # ANWESENHEIT & EINKAUF
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-person-card
            entity: person.marcus
            layout: horizontal
          - type: custom:mushroom-template-card
            primary: "Einkauf ({{ states('sensor.einkaufsliste_anzahl') }})"
            secondary: "Artikel auf der Liste"
            icon: mdi:cart
            icon_color: >
              {% if states('sensor.einkaufsliste_anzahl')|int(0) > 0 %}orange{% else %}green{% endif %}
            tap_action:
              action: navigate
              navigation_path: /lovelace-wetter/familie

      # =============================================
      # THW / DIVERA 24/7
      # =============================================
      # Alarm-Banner (nur bei aktiven Alarmen)
      - type: conditional
        conditions:
          - condition: numeric_state
            entity: sensor.divera_open_alarms_helper
            above: 0
        card:
          type: custom:mushroom-template-card
          primary: >
            {% set alarms = states.sensor
              | selectattr('entity_id', 'search', '_alarm_')
              | selectattr('attributes.closed', 'eq', false)
              | list %}
            {% if alarms | length > 0 %}
              ALARM: {{ alarms[0].state }}
            {% else %}
              Divera Alarm aktiv!
            {% endif %}
          secondary: >
            {% set alarms = states.sensor
              | selectattr('entity_id', 'search', '_alarm_')
              | selectattr('attributes.closed', 'eq', false)
              | list %}
            {% if alarms | length > 0 %}
              {{ alarms[0].attributes.get('address', '') }}
            {% endif %}
          icon: mdi:alarm-light
          icon_color: red
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 0, 0, 0.15) !important;
                border: 2px solid red !important;
                animation: pulse 2s infinite;
              }
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }
          tap_action:
            action: navigate
            navigation_path: /lovelace-thw/alarm-details

      # Nächster Divera-Termin
      - type: custom:mushroom-template-card
        primary: >
          {% set cals = states.calendar
            | selectattr('entity_id', 'search', '450712')
            | list %}
          {% if cals | length > 0 and cals[0].state == 'on' %}
            THW: {{ cals[0].attributes.get('message', 'Termin') }}
          {% else %}
            THW: Kein Termin
          {% endif %}
        secondary: >
          {% set cals = states.calendar
            | selectattr('entity_id', 'search', '450712')
            | list %}
          {% if cals | length > 0 and cals[0].attributes.get('start_time') %}
            {{ cals[0].attributes.get('start_time', '') }}
          {% else %}
            —
          {% endif %}
        icon: mdi:fire-truck
        icon_color: >
          {% set open = states('sensor.divera_open_alarms_helper') | int(0) %}
          {% if open > 0 %}red{% else %}blue{% endif %}
        tap_action:
          action: navigate
          navigation_path: /lovelace-thw/uebersicht

      # =============================================
      # SCHUPPEN WETTER (Außensensor Luft1)
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: "Außen {{ states('sensor.luft1_wetterstation_schuppen_temperatur_dht') }}°C"
            secondary: "Schuppen"
            icon: mdi:thermometer
            icon_color: >
              {% set t = states('sensor.luft1_wetterstation_schuppen_temperatur_dht')|float(0) %}
              {% if t > 25 %}red{% elif t > 10 %}green{% else %}blue{% endif %}
          - type: custom:mushroom-template-card
            primary: "Feuchte {{ states('sensor.luft1_wetterstation_schuppen_luftfeuchtigkeit') }}%"
            secondary: "Schuppen"
            icon: mdi:water-percent
            icon_color: cyan
          - type: custom:mushroom-template-card
            primary: >
              {% set e = states('sensor.tasmota_as3935_event_2') %}
              {% if e in ['1','2','3','4'] %}Blitz!
              {% elif e == '6' %}Störer
              {% elif e == '5' %}Rauschen
              {% else %}Blitz —{% endif %}
            secondary: >
              {% set d = states('sensor.tasmota_as3935_distance_2') %}
              {% if d not in ['unavailable', 'unknown', '0'] %}{{ d }} km{% else %}Kein Blitz{% endif %}
            icon: mdi:weather-lightning
            icon_color: >
              {% set e = states('sensor.tasmota_as3935_event_2') %}
              {% if e in ['1','2','3','4'] %}yellow
              {% elif e == '6' %}orange
              {% else %}grey{% endif %}

      # =============================================
      # INTERNET & FRITZ!BOX
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: >
              {% if is_state('binary_sensor.fritz_box_6591_cable_vodafone_connection', 'on') %}
                INet — Online
              {% else %}
                INet — Offline!
              {% endif %}
            secondary: >
              {% if is_state('binary_sensor.fritz_box_6591_cable_vodafone_connection', 'on') %}
                {{ states('sensor.fritz_uptime') }}
              {% else %}
                Getrennt!
              {% endif %}
            icon: >
              {% if is_state('binary_sensor.fritz_box_6591_cable_vodafone_connection', 'on') %}
                mdi:web-check
              {% else %}
                mdi:web-off
              {% endif %}
            icon_color: >
              {% if is_state('binary_sensor.fritz_box_6591_cable_vodafone_connection', 'on') %}green{% else %}red{% endif %}
            tap_action:
              action: navigate
              navigation_path: /lovelace-system/netzwerk-details
          - type: custom:mushroom-template-card
            primary: "↓{{ states('sensor.speedtest_download') }} Mb"
            secondary: "↑{{ states('sensor.speedtest_upload') }} Mb"
            icon: mdi:speedometer
            icon_color: green
          - type: custom:mushroom-template-card
            primary: "{{ states('sensor.speedtest_ping') }}ms Ping"
            secondary: >
              {% set p = states('sensor.speedtest_ping')|float(0) %}
              {% if p < 20 %}Gut{% elif p < 50 %}OK{% else %}Langsam{% endif %}
            icon: mdi:lan-pending
            icon_color: >
              {% set p = states('sensor.speedtest_ping')|float(0) %}
              {% if p < 20 %}green{% elif p < 50 %}orange{% else %}red{% endif %}

      # =============================================
      # ICEWIFI NETZWERK STATUS
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: >
              WiFi — {{ states('sensor.unifi_clients_total_2') }} Clients
            secondary: >
              {% set s = states('sensor.netzwerk_status') %}
              {{ s }}
            icon: >
              {% set s = states('sensor.netzwerk_status') %}
              {% if s == 'Alles OK' %}mdi:wifi-check
              {% elif s == 'Eingeschraenkt' %}mdi:wifi-alert
              {% else %}mdi:wifi-off{% endif %}
            icon_color: >
              {% set s = states('sensor.netzwerk_status') %}
              {% if s == 'Alles OK' %}green
              {% elif s == 'Eingeschraenkt' %}orange
              {% else %}red{% endif %}
            tap_action:
              action: navigate
              navigation_path: /lovelace-network/overview
          - type: custom:mushroom-template-card
            primary: >
              APs {{ states('sensor.unifi_aps_online_2') }}/{{ states('sensor.unifi_aps_gesamt') }}
            secondary: >
              INet {{ states('sensor.wifi_clients_bad_inet') }} · IoT {{ states('sensor.wifi_clients_bad_iot') }}
            icon: >
              {% set online = states('sensor.unifi_aps_online_2') | int(0) %}
              {% set total = states('sensor.unifi_aps_gesamt') | int(2) %}
              {% if online >= total %}mdi:access-point-check
              {% elif online > 0 %}mdi:access-point-minus
              {% else %}mdi:access-point-off{% endif %}
            icon_color: >
              {% set online = states('sensor.unifi_aps_online_2') | int(0) %}
              {% set total = states('sensor.unifi_aps_gesamt') | int(2) %}
              {% if online >= total %}green
              {% elif online > 0 %}orange
              {% else %}red{% endif %}
          - type: custom:mushroom-template-card
            primary: >
              Tor {{ states('sensor.wifi_clients_bad_bad') }}
            secondary: "Gastnetz"
            icon: mdi:incognito
            icon_color: >
              {% if states('sensor.wifi_clients_bad_bad') | int(0) > 0 %}purple{% else %}grey{% endif %}

      # =============================================
      # NAVIGATION ZU DASHBOARDS
      # =============================================
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Energie
            icon: mdi:flash
            layout: vertical
            icon_color: yellow
            tap_action:
              action: navigate
              navigation_path: /lovelace-energie
          - type: custom:mushroom-template-card
            primary: THW
            icon: mdi:fire-truck
            layout: vertical
            icon_color: >
              {% set open = states('sensor.divera_open_alarms_helper') | int(0) %}
              {% if open > 0 %}red{% else %}blue{% endif %}
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw
          - type: custom:mushroom-template-card
            primary: Wetter
            icon: mdi:weather-cloudy
            layout: vertical
            icon_color: blue
            tap_action:
              action: navigate
              navigation_path: /lovelace-wetter
          - type: custom:mushroom-template-card
            primary: Sauger
            icon: mdi:robot-vacuum
            layout: vertical
            icon_color: teal
            tap_action:
              action: navigate
              navigation_path: /lovelace-vacuum
      - type: horizontal-stack
        cards:
          - type: custom:mushroom-template-card
            primary: Räume
            icon: mdi:floor-plan
            layout: vertical
            icon_color: purple
            tap_action:
              action: navigate
              navigation_path: /lovelace-raeume
          - type: custom:mushroom-template-card
            primary: Medien
            icon: mdi:television
            layout: vertical
            icon_color: pink
            tap_action:
              action: navigate
              navigation_path: /lovelace-medien
          - type: custom:mushroom-template-card
            primary: System
            icon: mdi:cog
            layout: vertical
            icon_color: grey
            tap_action:
              action: navigate
              navigation_path: /lovelace-system
