  # ---- Detail/Verlauf: THW Mail Submission ----
  - title: THW Mail Submission
    path: dienst-mailsmtp
    icon: mdi:chart-line
    subview: true
    cards:
      - type: markdown
        content: |
          ## THW Mail Submission
          {% set on = states('sensor.thw_mail_submission_online_30t') | float(0) %}
          {% set meas = states('sensor.thw_mail_submission_gemessen_30t') | float(0) %}
          {% set pct = (on / meas * 100) if meas > 0 else none %}
          **Aktueller Status:** {{ '🟢 Erreichbar' if is_state('binary_sensor.thw_mail_submission','on') else ('🔴 Gestört' if is_state('binary_sensor.thw_mail_submission','off') else '⚪ Unbekannt') }}

          **Verfügbarkeit (letzte 30 Tage):** {{ (pct | round(3)) ~ ' %' if pct is not none else 'noch keine Daten' }}

          **Gemessen:** {{ meas | round(1) }} h · davon erreichbar {{ on | round(1) }} h

          **Status seit:** {{ as_timestamp(states.binary_sensor.thw_mail_submission.last_changed) | timestamp_custom('%d.%m.%Y %H:%M', true) }} Uhr
      - type: custom:apexcharts-card
        graph_span: 180d
        span:
          end: day
        header:
          show: true
          title: Verfügbarkeit über die Zeit (Langzeit-Statistik)
          show_states: false
        yaxis:
          - min: 0
            max: 100
            decimals: 0
        apex_config:
          chart:
            height: 260
          stroke:
            width: 2
        series:
          - entity: sensor.thw_mail_submission_uptime
            name: Verfügbarkeit %
            type: area
            curve: stepline
            float_precision: 1
            statistics:
              type: mean
              period: day
      - type: markdown
        title: Störungs-Diagnose (DNS · TLS · HTTP · Traceroute)
        content: |
          {% set d = (state_attr('sensor.thw_trace_log','data') or {}).get('thw_mail_submission') %}
          {% if d %}
          **{{ d.summary }}**

          {{ d.detail }}

          _Erstellt: {{ d.ts }}_
          {% else %}
          *Noch keine Störungs-Diagnose – wird bei einer Störung automatisch erstellt.*
          {% endif %}
      - type: history-graph
        title: Status-Verlauf (Rohdaten, max. 30 Tage)
        hours_to_show: 720
        entities:
          - entity: binary_sensor.thw_mail_submission
