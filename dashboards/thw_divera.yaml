# =============================================================================
# THW / DIVERA 24/7 DASHBOARD
# =============================================================================
# Zeigt Alarme, Verfügbarkeit, Fahrzeuge und Kalender aus Divera 24/7
# Entity-IDs werden dynamisch per Template gefunden (UCR-ID erst nach Config bekannt)

title: THW
views:
  # =========================================================================
  # VIEW 1: Übersicht
  # =========================================================================
  - title: Übersicht
    path: uebersicht
    icon: mdi:fire-truck
    cards:
      # -------------------------------------------------------------------
      # ALARM-BANNER (nur bei offenen Alarmen)
      # -------------------------------------------------------------------
      - type: conditional
        conditions:
          - condition: numeric_state
            entity_id: sensor.divera_open_alarms_helper
            above: 0
        card:
          type: custom:mushroom-template-card
          primary: >
            {% set alarms = states.sensor
              | selectattr('entity_id', 'search', '_alarm_')
              | selectattr('attributes.closed', 'eq', false)
              | list %}
            {% if alarms | length > 0 %}
              {{ alarms[0].state }}
            {% else %}
              Alarm aktiv
            {% endif %}
          secondary: >
            {% set alarms = states.sensor
              | selectattr('entity_id', 'search', '_alarm_')
              | selectattr('attributes.closed', 'eq', false)
              | list %}
            {% if alarms | length > 0 %}
              {{ alarms[0].attributes.get('text', '') [:100] }}
              — {{ alarms[0].attributes.get('address', '') }}
            {% endif %}
          icon: mdi:alarm-light
          icon_color: red
          card_mod:
            style: |
              ha-card {
                background-color: rgba(255, 0, 0, 0.15) !important;
                border: 2px solid red !important;
                animation: pulse 2s infinite;
              }
              @keyframes pulse {
                0%, 100% { opacity: 1; }
                50% { opacity: 0.7; }
              }
          tap_action:
            action: navigate
            navigation_path: /lovelace-thw/alarm-details

      # Fallback: Kein Alarm - alles ruhig
      - type: conditional
        conditions:
          - condition: numeric_state
            entity_id: sensor.divera_open_alarms_helper
            below: 1
        card:
          type: custom:mushroom-template-card
          primary: Keine aktiven Alarme
          secondary: >
            Letzte Aktualisierung: {{ now().strftime('%H:%M') }}
          icon: mdi:check-circle
          icon_color: green

      # -------------------------------------------------------------------
      # OFFENE ALARME ÜBERSICHT
      # -------------------------------------------------------------------
      - type: markdown
        title: Aktuelle Alarme
        content: >
          {% set alarms = states.sensor
            | selectattr('entity_id', 'search', '_alarm_')
            | rejectattr('state', 'eq', 'unavailable')
            | rejectattr('state', 'eq', 'unknown')
            | list %}
          {% if alarms | length == 0 %}
            *Keine Alarme vorhanden*
          {% else %}
            {% for alarm in alarms %}
          **{{ alarm.state }}**
          {{ alarm.attributes.get('text', 'Kein Text') }}
          Adresse: {{ alarm.attributes.get('address', 'Unbekannt') }}
          Priorität: {{ '🔴 Hoch' if alarm.attributes.get('priority', false) else '🟡 Normal' }}
          Status: {{ '✅ Geschlossen' if alarm.attributes.get('closed', false) else '🔴 Offen' }}
          {% if alarm.attributes.get('lat') and alarm.attributes.get('lng') %}
          [📍 Navigation](https://www.google.com/maps/dir/?api=1&destination={{ alarm.attributes.lat }},{{ alarm.attributes.lng }})
          {% endif %}
          ---
            {% endfor %}
          {% endif %}

      # -------------------------------------------------------------------
      # KALENDER - Nächste Termine
      # -------------------------------------------------------------------
      - type: markdown
        title: Kalender
        content: >
          {% set calendars = states.calendar
            | selectattr('entity_id', 'search', '450712')
            | list %}
          {% if calendars | length > 0 %}
            {% set cal = calendars[0] %}
            Nächster Termin: **{{ cal.attributes.get('message', 'Kein Termin') }}**
            {{ cal.attributes.get('start_time', '') }} — {{ cal.attributes.get('description', '') }}
            {% if cal.attributes.get('location') %}
            Ort: {{ cal.attributes.get('location') }}
            {% endif %}
          {% else %}
            *Kalender noch nicht verfügbar. Integration konfigurieren.*
          {% endif %}

      # -------------------------------------------------------------------
      # TERMINE MIT RÜCKMELDUNGS-STATUS (Zugesagt / Offen)
      # -------------------------------------------------------------------
      - type: markdown
        title: Termine & Rückmeldung
        content: |
          {% set src = states.sensor.divera_nachster_unbeantworteter_termin %}
          {% if src is none or src.state == 'unavailable' %}
            *Keine Termine verfügbar.*
          {% else %}
            {% set items = src.attributes.get('items', {}) %}
            {% set sorting = src.attributes.get('sorting', []) %}
            {% set ids = sorting if sorting else items.keys()|list %}
            {% set ns = namespace(rows=[]) %}
            {% for id in ids %}
              {% set it = items.get(id|string) or items.get(id) %}
              {% if it %}
                {% set p = it.get('participation', 0) %}
                {% set icon = '⏳ Offen' if p == 0
                              else '✅ Zugesagt' if p == 1
                              else '❓ Vielleicht' if p == 2
                              else '❌ Abgesagt' if p == 3
                              else '· (' ~ p ~ ')' %}
                {% set ts = it.get('start', 0) %}
                {% set dt = (ts | timestamp_custom('%a %d.%m. %H:%M', true)) if ts else '?' %}
                {% set title = it.get('title', '–') %}
                {% set loc = it.get('address', '') %}
                {% set ns.rows = ns.rows + [(ts, icon, dt, title, loc)] %}
              {% endif %}
            {% endfor %}
            {% set rows = ns.rows | sort(attribute=0) %}
            {% if rows | length == 0 %}
              *Keine Termine geladen.*
            {% else %}
            | Status | Termin | Titel |
            |---|---|---|
            {% for ts, icon, dt, title, loc in rows -%}
            | {{ icon }} | {{ dt }} | {{ title }}{% if loc %} _({{ loc }})_{% endif %} |
            {% endfor %}

            **Offen:** {{ rows | selectattr(1, 'eq', '⏳ Offen') | list | length }} ·
            **Zugesagt:** {{ rows | selectattr(1, 'eq', '✅ Zugesagt') | list | length }} ·
            **Abgesagt:** {{ rows | selectattr(1, 'eq', '❌ Abgesagt') | list | length }} ·
            **Vielleicht:** {{ rows | selectattr(1, 'eq', '❓ Vielleicht') | list | length }}
            {% endif %}
          {% endif %}

      # -------------------------------------------------------------------
      # PERSONALSTÄRKE / VERFÜGBARKEIT
      # -------------------------------------------------------------------
      - type: markdown
        title: Verfügbarkeit
        content: >
          {% set statuses = states.sensor
            | selectattr('entity_id', 'search', '_status_')
            | selectattr('entity_id', 'search', '450712')
            | rejectattr('state', 'eq', 'unavailable')
            | list %}
          {% if statuses | length == 0 %}
            *Keine Status-Daten. Integration konfigurieren.*
          {% else %}
            | Status | Personen |
            |--------|----------|
            {% for s in statuses %}
            | {{ s.attributes.get('friendly_name', s.name) }} | {{ s.state }} |
            {% endfor %}
          {% endif %}

      # -------------------------------------------------------------------
      # FAHRZEUGE
      # -------------------------------------------------------------------
      - type: markdown
        title: Fahrzeuge
        content: >
          {% set vehicles = states.sensor
            | selectattr('entity_id', 'search', '_vehicle_')
            | selectattr('entity_id', 'search', '450712')
            | rejectattr('state', 'eq', 'unavailable')
            | list %}
          {% if vehicles | length == 0 %}
            *Keine Fahrzeug-Daten. Integration konfigurieren.*
          {% else %}
            | Fahrzeug | FMS-Status |
            |----------|-----------|
            {% for v in vehicles %}
            | {{ v.attributes.get('friendly_name', v.name) }} | {{ v.state }} |
            {% endfor %}
          {% endif %}

      # -------------------------------------------------------------------
      # EINHEITS-DATEN
      # -------------------------------------------------------------------
      - type: markdown
        title: Einheit
        content: >
          {% set units = states.sensor
            | selectattr('entity_id', 'search', '_cluster_address')
            | list %}
          {% if units | length > 0 %}
            {% set u = units[0] %}
            **{{ u.attributes.get('friendly_name', 'Einheit') }}**
            UCR: {{ u.state }}
            {% if u.attributes.get('street') %}
            Adresse: {{ u.attributes.get('street', '') }}, {{ u.attributes.get('zip', '') }} {{ u.attributes.get('city', '') }}
            {% endif %}
          {% else %}
            *Einheitsdaten noch nicht verfügbar.*
          {% endif %}

  # =========================================================================
  # VIEW 2: Dienste-Überwachung
  # =========================================================================
  - title: Dienste
    path: dienste
    icon: mdi:lan-check
    cards:
      # -------------------------------------------------------------------
      # STATUS-BANNER
      # -------------------------------------------------------------------
      - type: custom:mushroom-template-card
        primary: >-
          {% set down = states('sensor.thw_dienste_gestort') | int(0) %}
          {% if down == 0 %}Alle THW-Dienste erreichbar{% else %}{{ down }} THW-Dienst(e) gestört{% endif %}
        secondary: >-
          Prüfung alle 5 Min · Neuprüfung 1 Min · Alarm nach 3 Fehlversuchen
          — Stand {{ now().strftime('%d.%m. %H:%M') }} Uhr
        icon: >-
          {% set down = states('sensor.thw_dienste_gestort') | int(0) %}
          {{ 'mdi:lan-disconnect' if down > 0 else 'mdi:lan-check' }}
        icon_color: >-
          {% set down = states('sensor.thw_dienste_gestort') | int(0) %}
          {{ 'red' if down > 0 else 'green' }}
        card_mod:
          style: |
            ha-card {
              {% if states('sensor.thw_dienste_gestort') | int(0) > 0 %}
              background-color: rgba(255, 0, 0, 0.12) !important;
              border: 2px solid red !important;
              {% else %}
              border: 2px solid rgba(0, 170, 0, 0.5) !important;
              {% endif %}
            }

      # -------------------------------------------------------------------
      # RUBRIK: ÜBERWACHTE THW-DIENSTE (Live-Tabelle)
      # -------------------------------------------------------------------
      - type: markdown
        title: Überwachte THW-Dienste
        content: |
          {% set svcs = states.binary_sensor
            | selectattr('entity_id','search','thw_(web|vpn|mail)_')
            | list | sort(attribute='name') %}
          | Dienst | Status | Seit |
          |---|---|---|
          {% for s in svcs -%}
          | {{ s.attributes.get('friendly_name', s.name) }} | {{ '🟢 OK' if s.state == 'on' else ('🔴 Gestört' if s.state == 'off' else '⚪ Unbekannt') }} | {{ s.last_changed | as_timestamp | timestamp_custom('%d.%m. %H:%M', true) }} |
          {% endfor %}

          **Gestört:** {{ states('sensor.thw_dienste_gestort') }} · **Gesamt:** {{ svcs | length }}

      # -------------------------------------------------------------------
      # KACHEL-ÜBERSICHT (grün = OK, rot = gestört)
      # -------------------------------------------------------------------
      - type: grid
        columns: 3
        square: false
        cards:
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_web_heroesday_de
            primary: heroesday.de
            secondary: >-
              {% if is_state('binary_sensor.thw_web_heroesday_de','on') %}OK{% elif is_state('binary_sensor.thw_web_heroesday_de','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_web_heroesday_de',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_web_heroesday_de','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_web_heroesday_de','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-heroesday
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_web_herosbeach_de
            primary: herosbeach.de
            secondary: >-
              {% if is_state('binary_sensor.thw_web_herosbeach_de','on') %}OK{% elif is_state('binary_sensor.thw_web_herosbeach_de','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_web_herosbeach_de',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_web_herosbeach_de','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_web_herosbeach_de','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-herosbeach
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_web_herosday_de
            primary: herosday.de
            secondary: >-
              {% if is_state('binary_sensor.thw_web_herosday_de','on') %}OK{% elif is_state('binary_sensor.thw_web_herosday_de','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_web_herosday_de',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_web_herosday_de','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_web_herosday_de','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-herosday
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_web_riesenkicker_info
            primary: riesenkicker.info
            secondary: >-
              {% if is_state('binary_sensor.thw_web_riesenkicker_info','on') %}OK{% elif is_state('binary_sensor.thw_web_riesenkicker_info','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_web_riesenkicker_info',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_web_riesenkicker_info','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_web_riesenkicker_info','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-riesenkicker
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_web_thwfv_muenchen_ost_de
            primary: thwfv-muc-ost.de
            secondary: >-
              {% if is_state('binary_sensor.thw_web_thwfv_muenchen_ost_de','on') %}OK{% elif is_state('binary_sensor.thw_web_thwfv_muenchen_ost_de','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_web_thwfv_muenchen_ost_de',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_web_thwfv_muenchen_ost_de','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_web_thwfv_muenchen_ost_de','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-thwfv
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_web_weinfest
            primary: weinfest
            secondary: >-
              {% if is_state('binary_sensor.thw_web_weinfest','on') %}OK{% elif is_state('binary_sensor.thw_web_weinfest','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_web_weinfest',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_web_weinfest','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_web_weinfest','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-weinfest
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_web_thw_muenchen_ost_de
            primary: thw-muc-ost.de
            secondary: >-
              {% if is_state('binary_sensor.thw_web_thw_muenchen_ost_de','on') %}OK{% elif is_state('binary_sensor.thw_web_thw_muenchen_ost_de','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_web_thw_muenchen_ost_de',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_web_thw_muenchen_ost_de','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_web_thw_muenchen_ost_de','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-thwmucost
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_vpn_intranet
            primary: VPN Intranet
            secondary: >-
              {% if is_state('binary_sensor.thw_vpn_intranet','on') %}OK{% elif is_state('binary_sensor.thw_vpn_intranet','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_vpn_intranet',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_vpn_intranet','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_vpn_intranet','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-vpn
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_mail_imaps
            primary: Mail IMAPS
            secondary: >-
              {% if is_state('binary_sensor.thw_mail_imaps','on') %}OK{% elif is_state('binary_sensor.thw_mail_imaps','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_mail_imaps',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_mail_imaps','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_mail_imaps','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-mailimaps
          - type: custom:mushroom-template-card
            entity: binary_sensor.thw_mail_submission
            primary: Mail SMTP
            secondary: >-
              {% if is_state('binary_sensor.thw_mail_submission','on') %}OK{% elif is_state('binary_sensor.thw_mail_submission','off') %}{{ (state_attr('sensor.thw_trace_log','data') or {}).get('thw_mail_submission',{}).get('summary','Diagnose läuft…') }}{% else %}–{% endif %}
            icon: "{{ 'mdi:check-circle' if is_state('binary_sensor.thw_mail_submission','on') else 'mdi:alert-circle' }}"
            icon_color: "{{ 'green' if is_state('binary_sensor.thw_mail_submission','on') else 'red' }}"
            layout: vertical
            tap_action:
              action: navigate
              navigation_path: /lovelace-thw/dienst-mailsmtp

      # -------------------------------------------------------------------
      # EINSTELLUNGEN & STEUERUNG
      # -------------------------------------------------------------------
      - type: entities
        title: Überwachung & Alarmierung
        show_header_toggle: false
        entities:
          - entity: binary_sensor.thw_dienste_gesamt
            name: Gesamtstatus (Problem = Störung)
          - entity: sensor.thw_dienste_gestort
            name: Anzahl gestörter Dienste
          - type: section
            label: Einstellungen
          - entity: input_boolean.thw_dienste_alarm_pause
            name: Alarme pausieren (AUS = aktiv)
          - entity: input_boolean.thw_pushover_enabled
            name: Echte Pushover-API nutzen (sonst iPhone-Push)

      # -------------------------------------------------------------------
      # LETZTE 5 ALARMIERUNGEN
      # -------------------------------------------------------------------
      - type: markdown
        title: Letzte Alarmierungen
        content: |
          {% set items = state_attr('sensor.thw_alarm_log','eintraege') or [] %}
          {% if items | length == 0 %}
          *Noch keine Alarmierungen seit Aktivierung.*
          {% else %}
          | Zeit | Dienst / Grund | Kanal |
          |---|---|---|
          {% for it in items -%}
          | {{ it.zeit }} | {{ it.dienst }} | {{ it.kanal }} |
          {% endfor %}
          {% endif %}

      # -------------------------------------------------------------------
      # STÖRUNGSHISTORIE (kompakt) — Details unter /lovelace-thw/stoerungen
      # -------------------------------------------------------------------
      - type: markdown
        title: Störungshistorie
        content: |
          {% set items = state_attr('sensor.thw_stoerungs_log','eintraege') or [] %}
          {% if items | length == 0 %}
          *Noch keine Störungen aufgezeichnet.*
          {% else %}
          | Beginn | Dienst | Kategorie | Vermutliche Ursache | Status |
          |---|---|---|---|---|
          {% for it in items -%}
          | {{ it.beginn }} | {{ it.dienst }} | **{{ it.kategorie }}** | {{ it.ursache | truncate(70, true, '…') }} | {% if it.status == 'behoben' %}✅ behoben ({% if it.dauer >= 60 %}{{ it.dauer // 60 }} h {{ it.dauer % 60 }} m{% else %}{{ it.dauer }} min{% endif %}){% else %}🔴 offen{% endif %} |
          {% endfor %}
          {% endif %}

          [→ Vollständige Störungs-Details mit Diagnosebericht](/lovelace-thw/stoerungen)

  # =========================================================================
  # VIEW: Störungs-Details (Subview) — vollständige Diagnoseberichte
  # =========================================================================
  - title: Störungs-Details
    path: stoerungen
    icon: mdi:clipboard-pulse
    subview: true
    cards:
      - type: markdown
        content: |
          ## Störungshistorie – vollständige Diagnose
          {% set items = state_attr('sensor.thw_stoerungs_log','eintraege') or [] %}
          {% if items | length == 0 %}
          *Noch keine Störungen aufgezeichnet. Sobald ein Dienst ausfällt und die
          Störung nach 3 Neuprüfungen bestätigt ist, erscheint hier der komplette
          Diagnosebericht (DNS · TCP · TLS-Zertifikat · HTTP-Timing · Traceroute)
          inklusive der wahrscheinlichen Ursache.*
          {% else %}
          _Die letzten {{ items | length }} bestätigten Störungen. Ältere Berichte
          liegen dauerhaft als Datei unter `/config/thw_trace/incidents/`._
          {% for it in items %}

          ---

          ### {{ loop.index }}. {{ it.dienst }} — {{ it.kategorie }}
          **Beginn:** {{ it.beginn }}{% if it.status == 'behoben' %} · **Ende:** {{ it.ende }} · **Dauer:** {% if it.dauer >= 60 %}{{ it.dauer // 60 }} h {{ it.dauer % 60 }} min{% else %}{{ it.dauer }} min{% endif %} · ✅ behoben{% else %} · 🔴 noch offen{% endif %} · **Kanal:** {{ it.kanal }}

          **Vermutliche Ursache:** {{ it.ursache }}

          {{ it.detail }}
          {% endfor %}
          {% endif %}

  # =========================================================================
  # VIEW 3: Alarm-Details (Subview)
  # =========================================================================
  - title: Alarm-Details
    path: alarm-details
    icon: mdi:alarm-light
    subview: true
    cards:
      # -------------------------------------------------------------------
      # ALARM-VOLLANSICHT
      # -------------------------------------------------------------------
      - type: markdown
        title: Alarm-Details
        content: >
          {% set alarms = states.sensor
            | selectattr('entity_id', 'search', '_alarm_')
            | rejectattr('state', 'eq', 'unavailable')
            | rejectattr('state', 'eq', 'unknown')
            | list %}
          {% if alarms | length == 0 %}
            *Kein aktiver Alarm.*
          {% else %}
            {% set a = alarms[0] %}
          ## {{ a.state }}

          **Meldungstext:** {{ a.attributes.get('text', 'Kein Text') }}

          **Adresse:** {{ a.attributes.get('address', 'Unbekannt') }}

          **Priorität:** {{ '🔴 Hoch' if a.attributes.get('priority', false) else '🟡 Normal' }}

          **Status:** {{ '✅ Geschlossen' if a.attributes.get('closed', false) else '🔴 Offen' }}

          **Datum:** {{ a.attributes.get('date', 'Unbekannt') }}

          {% if a.attributes.get('group') %}
          **Gruppen:** {{ a.attributes.get('group', '') }}
          {% endif %}

          {% if a.attributes.get('self_addressed') is not none %}
          **Selbst adressiert:** {{ 'Ja' if a.attributes.get('self_addressed', false) else 'Nein' }}
          {% endif %}

          {% if a.attributes.get('answered') is not none %}
          **Rückmeldung:** {{ a.attributes.get('answered', 'Keine') }}
          {% endif %}

          {% if a.attributes.get('lat') and a.attributes.get('lng') %}
          ---
          ### Navigation
          [📍 Google Maps öffnen](https://www.google.com/maps/dir/?api=1&destination={{ a.attributes.lat }},{{ a.attributes.lng }})

          [🗺️ Auf Karte anzeigen](https://www.google.com/maps?q={{ a.attributes.lat }},{{ a.attributes.lng }})
          {% endif %}
          {% endif %}

      # -------------------------------------------------------------------
      # KARTE MIT EINSATZORT
      # -------------------------------------------------------------------
      - type: markdown
        title: Einsatzort
        content: >
          {% set alarms = states.sensor
            | selectattr('entity_id', 'search', '_alarm_')
            | rejectattr('state', 'eq', 'unavailable')
            | list %}
          {% if alarms | length > 0 and alarms[0].attributes.get('lat') and alarms[0].attributes.get('lng') %}
            ![Karte](https://maps.googleapis.com/maps/api/staticmap?center={{ alarms[0].attributes.lat }},{{ alarms[0].attributes.lng }}&zoom=14&size=600x300&markers=color:red|{{ alarms[0].attributes.lat }},{{ alarms[0].attributes.lng }})
          {% else %}
            *Keine Koordinaten verfügbar.*
          {% endif %}

      # -------------------------------------------------------------------
      # ALLE ALARME (wenn mehrere offen)
      # -------------------------------------------------------------------
      - type: markdown
        title: Alle Alarme
        content: >
          {% set alarms = states.sensor
            | selectattr('entity_id', 'search', '_alarm_')
            | rejectattr('state', 'eq', 'unavailable')
            | rejectattr('state', 'eq', 'unknown')
            | list %}
          {% if alarms | length <= 1 %}
            *Keine weiteren Alarme.*
          {% else %}
            {% for alarm in alarms[1:] %}
          **{{ alarm.state }}** — {{ alarm.attributes.get('address', '') }}
          Status: {{ '✅ Geschlossen' if alarm.attributes.get('closed', false) else '🔴 Offen' }}
          ---
            {% endfor %}
          {% endif %}
  # ---- Detail/Verlauf: THW Web heroesday.de ----
  - title: THW Web heroesday.de
    path: dienst-heroesday
    icon: mdi:chart-line
    subview: true
    cards:
      - type: markdown
        content: |
          ## THW Web heroesday.de
          {% set on = states('sensor.thw_web_heroesday_de_online_30t') | float(0) %}
          {% set meas = states('sensor.thw_web_heroesday_de_gemessen_30t') | float(0) %}
          {% set pct = (on / meas * 100) if meas > 0 else none %}
          **Aktueller Status:** {{ '🟢 Erreichbar' if is_state('binary_sensor.thw_web_heroesday_de','on') else ('🔴 Gestört' if is_state('binary_sensor.thw_web_heroesday_de','off') else '⚪ Unbekannt') }}

          **Verfügbarkeit (letzte 30 Tage):** {{ (pct | round(3)) ~ ' %' if pct is not none else 'noch keine Daten' }}

          **Gemessen:** {{ meas | round(1) }} h · davon erreichbar {{ on | round(1) }} h

          **Status seit:** {{ as_timestamp(states.binary_sensor.thw_web_heroesday_de.last_changed) | timestamp_custom('%d.%m.%Y %H:%M', true) }} Uhr
      - type: custom:apexcharts-card
        graph_span: 180d
        span:
          end: day
        header:
          show: true
          title: Verfügbarkeit über die Zeit (Langzeit-Statistik)
          show_states: false
        yaxis:
          - min: 0
            max: 100
            decimals: 0
        apex_config:
          chart:
            height: 260
          stroke:
            width: 2
        series:
          - entity: sensor.thw_web_heroesday_de_uptime
            name: Verfügbarkeit %
            type: area
            curve: stepline
            float_precision: 1
            statistics:
              type: mean
              period: day
      - type: markdown
        title: Störungs-Diagnose (DNS · TLS · HTTP · Traceroute)
        content: |
          {% set d = (state_attr('sensor.thw_trace_log','data') or {}).get('thw_web_heroesday_de') %}
          {% if d %}
          **{{ d.summary }}**

          {{ d.detail }}

          _Erstellt: {{ d.ts }}_
          {% else %}
          *Noch keine Störungs-Diagnose – wird bei einer Störung automatisch erstellt.*
          {% endif %}
      - type: history-graph
        title: Status-Verlauf (Rohdaten, max. 30 Tage)
        hours_to_show: 720
        entities:
          - entity: binary_sensor.thw_web_heroesday_de
