title: Smart Home
views:
  # ===========================================================================
  # STARTSEITE
  # ===========================================================================
  - title: Home
    path: home
    icon: mdi:home
    cards:
      - type: markdown
        content: "## Willkommen"

      # Schnellübersicht
      - type: horizontal-stack
        cards:
          - type: entity
            entity: weather.forecast_home
            name: Wetter
          - type: entity
            entity: sensor.paule_electricity_price
            name: Strompreis
          - type: entity
            entity: sensor.pv_leistung
            name: PV

      # Warnungen
      - type: conditional
        conditions:
          - entity: sensor.nina_munchen_warnungen_anzahl
            state_not: "0"
        card:
          type: markdown
          content: |
            ### Aktive Warnungen
            {{ states('sensor.warnungen_zusammenfassung') }}

      # Personen
      - type: entities
        title: Anwesenheit
        entities:
          - entity: person.marcus
            name: Marcus

      # Schnellzugriff
      - type: horizontal-stack
        cards:
          - type: button
            name: Energie
            icon: mdi:flash
            tap_action:
              action: navigate
              navigation_path: /lovelace-energie
          - type: button
            name: Wetter
            icon: mdi:weather-cloudy
            tap_action:
              action: navigate
              navigation_path: /lovelace-wetter
          - type: button
            name: System
            icon: mdi:cog
            tap_action:
              action: navigate
              navigation_path: /lovelace-system

      # Aktive Geräte
      - type: entities
        title: Aktive Verbraucher
        entities:
          - entity: sensor.pv_leistung
            name: PV Erzeugung
          - entity: sensor.server_leistung
            name: Server
          - entity: sensor.arbeitszimmer_leistung
            name: Arbeitszimmer

  # ===========================================================================
  # RÄUME - EG
  # ===========================================================================
  - title: Erdgeschoss
    path: eg
    icon: mdi:home-floor-0
    cards:
      - type: markdown
        content: "## Erdgeschoss"

      # Wohnzimmer
      - type: vertical-stack
        title: Wohnzimmer
        cards:
          - type: horizontal-stack
            cards:
              - type: entity
                entity: media_player.kd_55xe8505
                name: Sony TV
              - type: entity
                entity: light.led_welt_led_welt
                name: LED-Welt
              - type: entity
                entity: select.led_welt_led_welt_szene
                name: LED-Welt Szene

      # Küche
      - type: vertical-stack
        title: Küche
        cards:
          - type: entity
            entity: sensor.kueche_leistung
            name: Verbrauch

      # Büro/Arbeitszimmer
      - type: vertical-stack
        title: Arbeitszimmer
        cards:
          - type: horizontal-stack
            cards:
              - type: entity
                entity: sensor.arbeitszimmer_leistung
                name: Verbrauch
              - type: entity
                entity: switch.strom_arbeitszimmer
                name: Schalter
              - type: entity
                entity: light.wled2
                name: WLED2

  # ===========================================================================
  # RÄUME - OG
  # ===========================================================================
  - title: Obergeschoss
    path: og
    icon: mdi:home-floor-1
    cards:
      - type: markdown
        content: "## Obergeschoss"

      # Schlafzimmer - Luftqualität (Luft1)
      - type: vertical-stack
        title: Schlafzimmer - Luftqualität (Luft1)
        cards:
          - type: horizontal-stack
            cards:
              - type: entity
                entity: sensor.luft1_wetterstation_schuppen_temperatur_dht
                name: Temperatur
              - type: entity
                entity: sensor.luft1_wetterstation_schuppen_luftfeuchtigkeit
                name: Luftfeuchtigkeit
              - type: entity
                entity: sensor.luft1_wetterstation_luft1_luftqualitaet_ppm
                name: CO2 (äquiv.)
              - type: entity
                entity: sensor.luft1_wetterstation_luft1_luftqualitaet_bewertung
                name: Bewertung
          - type: custom:apexcharts-card
            header:
              title: Klima - Tag
              show: true
            graph_span: 24h
            yaxis:
              - id: temp
                decimals: 1
                apex_config:
                  title:
                    text: "°C"
              - id: pct
                opposite: true
                min: 0
                max: 100
                apex_config:
                  title:
                    text: "%"
            series:
              - entity: sensor.luft1_wetterstation_schuppen_temperatur_dht
                name: Temperatur
                yaxis_id: temp
                curve: smooth
                color: "#F44336"
              - entity: sensor.luft1_wetterstation_schuppen_luftfeuchtigkeit
                name: Luftfeuchtigkeit
                yaxis_id: pct
                curve: smooth
                color: "#2196F3"
          - type: custom:apexcharts-card
            header:
              title: Klima - Monat
              show: true
            graph_span: 30d
            yaxis:
              - id: temp
                decimals: 1
                apex_config:
                  title:
                    text: "°C"
              - id: pct
                opposite: true
                min: 0
                max: 100
                apex_config:
                  title:
                    text: "%"
            series:
              - entity: sensor.luft1_wetterstation_schuppen_temperatur_dht
                name: Temperatur
                yaxis_id: temp
                curve: smooth
                color: "#F44336"
                group_by:
                  func: avg
                  duration: 2h
              - entity: sensor.luft1_wetterstation_schuppen_luftfeuchtigkeit
                name: Luftfeuchtigkeit
                yaxis_id: pct
                curve: smooth
                color: "#2196F3"
                group_by:
                  func: avg
                  duration: 2h
          - type: custom:apexcharts-card
            header:
              title: Luftqualität (CO2-äquiv.) - Tag
              show: true
            graph_span: 24h
            yaxis:
              - id: ppm
                decimals: 0
                apex_config:
                  title:
                    text: "ppm"
            series:
              - entity: sensor.luft1_wetterstation_luft1_luftqualitaet_ppm
                name: CO2 äquiv.
                yaxis_id: ppm
                curve: smooth
                color: "#9C27B0"
          - type: custom:apexcharts-card
            header:
              title: Luftqualität (CO2-äquiv.) - Monat
              show: true
            graph_span: 30d
            yaxis:
              - id: ppm
                decimals: 0
                apex_config:
                  title:
                    text: "ppm"
            series:
              - entity: sensor.luft1_wetterstation_luft1_luftqualitaet_ppm
                name: CO2 äquiv.
                yaxis_id: ppm
                curve: smooth
                color: "#9C27B0"
                group_by:
                  func: avg
                  duration: 2h

      - type: markdown
        content: |
          *Heizungs- und Klimasteuerung noch nicht konfiguriert.*

          Verfügbare Integrationen:
          - Homematic CCU
          - Fritz!DECT Thermostate
          - Tado

  # ===========================================================================
  # GARTEN
  # ===========================================================================
  - title: Garten
    path: garten
    icon: mdi:flower
    cards:
      - type: markdown
        content: "## Garten & Außenbereich"

      # Bewässerung (Platzhalter)
      - type: markdown
        content: |
          ### Bewässerung
          *Bewässerungssteuerung noch nicht konfiguriert.*
