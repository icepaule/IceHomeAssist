# Energy Package - PV System & Tibber Integration
# Migrated from ioBroker PV_Matrix, follow_the_sun, Tibber scripts
#
# This package consolidates all energy-related configuration.

# =============================================================================
# TEMPLATE SENSORS
# FIX: Updated entity references:
#   sensor.pv_inverter_power -> sensor.pv_leistung (Tasmota ENERGY Power)
#   sensor.pv_inverter_energy_today -> sensor.pv_energie_heute (Tasmota ENERGY Today)
#   sensor.electricity_price -> sensor.paule_electricity_price (Tibber integration)
#   sensor.grid_power -> sensor.netzverbrauch_aktuell (template in energie_kosten.yaml)
#   sensor.grid_import -> sensor.tibber_pulse_paule_accumulated_consumption (Tibber Pulse)
#   sensor.grid_export -> sensor.tibber_pulse_paule_accumulated_production (Tibber Pulse)
#   number.pv_panel_angle -> does not exist; automation/script commented out
# =============================================================================
template:
  - sensor:
      # Total PV production
      - name: "PV Total Power"
        unique_id: pv_total_power
        unit_of_measurement: "W"
        device_class: power
        state_class: measurement
        state: >
          {% set p1 = states('sensor.pv_leistung')|float(0) %}
          {{ p1 | round(1) }}
        availability: >
          {{ states('sensor.pv_leistung') not in ['unknown', 'unavailable'] }}

      # PV daily energy production
      - name: "PV Energy Today"
        unique_id: pv_energy_today
        unit_of_measurement: "kWh"
        device_class: energy
        state_class: total_increasing
        state: >
          {{ states('sensor.pv_energie_heute')|float(0) | round(2) }}

      # NOTE: Tibber Current Price removed here - defined in
      # automations/tibber_next24h.yaml (unique_id: tibber_current_price) and
      # templates/energie_kosten.yaml (unique_id: tibber_current_price_eur)

      # Daily savings from PV
      - name: "PV Daily Savings"
        unique_id: pv_daily_savings
        unit_of_measurement: "EUR"
        state: >
          {% set energy = states('sensor.pv_energy_today')|float(0) %}
          {% set price = states('sensor.tibber_current_price')|float(0.30) %}
          {{ (energy * price) | round(2) }}

      # Monthly savings calculation
      - name: "PV Monthly Savings"
        unique_id: pv_monthly_savings
        unit_of_measurement: "EUR"
        state: >
          {% set energy = states('sensor.pv_energy_monthly')|float(0) %}
          {% set avg_price = 0.30 %}  {# Average price assumption #}
          {{ (energy * avg_price) | round(2) }}

      # Sun position for panel tracking (follow_the_sun)
      - name: "Optimal Panel Angle"
        unique_id: optimal_panel_angle
        unit_of_measurement: "°"
        state: >
          {% set elevation = state_attr('sun.sun', 'elevation')|float(0) %}
          {% set optimal = 90 - elevation %}
          {{ [0, [optimal, 60]|min]|max | round(0) }}

      # Grid export/import indicator
      - name: "Grid Direction"
        unique_id: grid_direction
        state: >
          {% set grid = states('sensor.netzverbrauch_aktuell')|float(0) %}
          {% if grid > 50 %}
            importing
          {% elif grid < -50 %}
            exporting
          {% else %}
            balanced
          {% endif %}
        icon: >
          {% set grid = states('sensor.netzverbrauch_aktuell')|float(0) %}
          {% if grid > 50 %}
            mdi:transmission-tower-import
          {% elif grid < -50 %}
            mdi:transmission-tower-export
          {% else %}
            mdi:transmission-tower
          {% endif %}

# =============================================================================
# UTILITY METERS
# FIX: Updated sources to actual Tibber Pulse sensors:
#   sensor.grid_import -> sensor.tibber_pulse_paule_accumulated_consumption
#   sensor.grid_export -> sensor.tibber_pulse_paule_accumulated_production
# =============================================================================
utility_meter:
  pv_energy_daily:
    source: sensor.pv_energy_today
    cycle: daily

  pv_energy_monthly:
    source: sensor.pv_energy_today
    cycle: monthly

  pv_energy_yearly:
    source: sensor.pv_energy_today
    cycle: yearly

  grid_import_daily:
    source: sensor.tibber_pulse_paule_accumulated_consumption
    cycle: daily

  grid_export_daily:
    source: sensor.tibber_pulse_paule_accumulated_production
    cycle: daily

  # --- Grid Import monthly/yearly ---
  grid_import_monthly:
    source: sensor.tibber_pulse_paule_accumulated_consumption
    cycle: monthly

  grid_import_yearly:
    source: sensor.tibber_pulse_paule_accumulated_consumption
    cycle: yearly

  # --- Server ---
  server_energy_daily:
    source: sensor.server_energie_gesamt
    cycle: daily

  server_energy_monthly:
    source: sensor.server_energie_gesamt
    cycle: monthly

  # --- Kueche ---
  kueche_energy_daily:
    source: sensor.kueche_energie_gesamt
    cycle: daily

  kueche_energy_monthly:
    source: sensor.kueche_energie_gesamt
    cycle: monthly

  # --- Waschmaschine ---
  waschmaschine_energy_monthly:
    source: sensor.waschmaschine_energie_gesamt
    cycle: monthly

  # --- Trockner ---
  trockner_energy_monthly:
    source: sensor.trockner_energie_gesamt
    cycle: monthly

  # --- Arbeitszimmer ---
  arbeitszimmer_energy_daily:
    source: sensor.arbeitszimmer_energie_gesamt
    cycle: daily

  arbeitszimmer_energy_monthly:
    source: sensor.arbeitszimmer_energie_gesamt
    cycle: monthly

# =============================================================================
# INPUT HELPERS
# =============================================================================
input_boolean:
  pv_auto_tracking:
    name: "PV Auto Tracking"
    icon: mdi:solar-power-variant

  pv_manual_override:
    name: "PV Manual Override"
    icon: mdi:hand-back-left

  # Strompreis notification toggle
  guenstiger_strom_benachrichtigung:
    name: "Günstig-Strom Benachrichtigung"
    icon: mdi:cash-check

  # Waschmaschine waiting for cheap electricity
  waschmaschine_warten:
    name: "Waschmaschine wartet auf günstigen Strom"
    icon: mdi:washing-machine

  # Trockner waiting for cheap electricity
  trockner_warten:
    name: "Trockner wartet auf günstigen Strom"
    icon: mdi:tumble-dryer

# Strompreis threshold
input_number:
  strompreis_schwelle:
    name: "Strompreis-Schwelle günstig"
    icon: mdi:currency-eur
    unit_of_measurement: "ct/kWh"
    min: 15
    max: 50
    step: 0.5
    initial: 25
    mode: slider

# FIX: Removed duplicate input_number.pv_manual_angle - it is already defined
# in pv_follow_the_sun.yaml with the correct min:20/max:70 range.

