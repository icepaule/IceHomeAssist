# =============================================================================
# EXTERNAL DATA SOURCES (Phase 5)
# =============================================================================
rest:
  # --- EPEX Spot Price from Energy-Charts.info (kostenlos, kein API-Key) ---
  - resource: "https://api.energy-charts.info/price?bzn=DE-LU&resolution=hour"
    scan_interval: 3600
    timeout: 30
    sensor:
      - name: "EPEX Spot Preis"
        unique_id: epex_spot_preis
        value_template: >
          {% set prices = value_json.price %}
          {% set timestamps = value_json.unix_seconds %}
          {% set now_ts = as_timestamp(now()) | int %}
          {% set ns = namespace(price=0) %}
          {% for i in range(timestamps | length - 1) %}
            {% if timestamps[i] <= now_ts < timestamps[i+1] %}
              {% set ns.price = prices[i] %}
            {% endif %}
          {% endfor %}
          {{ (ns.price / 10) | round(2) }}
        unit_of_measurement: "ct/kWh"
        device_class: monetary
        icon: mdi:chart-areaspline
