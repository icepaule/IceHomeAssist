# Notifications Package - Pushover (iPhone-Fallback), Alexa
# Migrated from ioBroker pushover, alexa2 adapters (telegram-menu entfernt 26.07., nie fertig eingerichtet)
#
# This package consolidates all notification-related configuration.

# =============================================================================
# INPUT HELPERS FOR NOTIFICATION SETTINGS
# =============================================================================
input_boolean:
  notifications_enabled:
    name: "Notifications Enabled"
    icon: mdi:bell

  notifications_night_mode:
    name: "Night Mode (Quiet)"
    icon: mdi:bell-sleep

  notify_pv_events:
    name: "Notify PV Events"
    icon: mdi:solar-power

  notify_security_events:
    name: "Notify Security Events"
    icon: mdi:shield-home

  notify_weather_alerts:
    name: "Notify Weather Alerts"
    icon: mdi:weather-lightning

input_select:
  notification_level:
    name: "Notification Level"
    options:
      - "All"
      - "Important"
      - "Critical Only"
    icon: mdi:bell-badge

# =============================================================================
# SCRIPTS FOR NOTIFICATIONS
# =============================================================================
script:
  # Main notification script - routes to appropriate service
  send_notification:
    alias: "Send Notification"
    description: "Central notification dispatcher"
    fields:
      title:
        description: "Notification title"
        example: "Alert"
      message:
        description: "Notification message"
        example: "Something happened"
      priority:
        description: "Priority: low, normal, high, critical"
        example: "normal"
      targets:
        description: "Target services: pushover, alexa, all"
        example: "pushover"
    sequence:
      - choose:
          # Critical - send to all
          - conditions:
              - condition: template
                value_template: "{{ priority == 'critical' }}"
            sequence:
              - service: script.notify_pushover
                data:
                  title: "🚨 {{ title }}"
                  message: "{{ message }}"
                  priority: 1
              - service: script.notify_alexa
                data:
                  message: "Achtung! {{ message }}"

          # High priority
          - conditions:
              - condition: template
                value_template: "{{ priority == 'high' }}"
            sequence:
              - service: script.notify_pushover
                data:
                  title: "⚠️ {{ title }}"
                  message: "{{ message }}"
              - condition: state
                entity_id: input_boolean.notifications_night_mode
                state: "off"
              - service: script.notify_alexa
                data:
                  message: "{{ message }}"

          # Normal priority
          - conditions:
              - condition: template
                value_template: "{{ priority in ['normal', 'low'] }}"
            sequence:
              - condition: state
                entity_id: input_boolean.notifications_enabled
                state: "on"
              - service: script.notify_pushover
                data:
                  title: "{{ title }}"
                  message: "{{ message }}"
    mode: queued

  # Pushover notification (Integration deinstalliert 2026-05; fällt auf
  # iPhone-Push zurück, damit notify.pushover-Repair verschwindet)
  notify_pushover:
    alias: "Notify via Pushover (fallback iPhone)"
    fields:
      title:
        description: "Message title"
      message:
        description: "Message text"
      priority:
        description: "Priority: -2 to 2"
        example: 0
    sequence:
      - service: notify.mobile_app_iphone_von_marcus
        data:
          title: "{{ title }}"
          message: "{{ message }}"
    mode: queued

  # Alexa announcement
  notify_alexa:
    alias: "Announce via Alexa"
    fields:
      message:
        description: "Announcement text"
      target:
        description: "Target device(s)"
        example: "media_player.marcus_echo_show_8_2nd_gen"
    sequence:
      - condition: state
        entity_id: input_boolean.notifications_night_mode
        state: "off"
      - service: notify.alexa_media
        data:
          target: "{{ target | default('media_player.marcus_echo_show_8_2nd_gen') }}"
          message: "{{ message }}"
          data:
            type: announce
    mode: queued


automation:
  # Night mode schedule
  - id: notification_night_mode_on
    alias: "Notifications: Night Mode On"
    trigger:
      - platform: time
        at: "22:00:00"
    action:
      - service: input_boolean.turn_on
        target:
          entity_id: input_boolean.notifications_night_mode

  - id: notification_night_mode_off
    alias: "Notifications: Night Mode Off"
    trigger:
      - platform: time
        at: "07:00:00"
    action:
      - service: input_boolean.turn_off
        target:
          entity_id: input_boolean.notifications_night_mode