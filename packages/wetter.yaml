# =============================================================================
# WETTER PAKET - Wetter, Vorhersagen, Warnungen
# =============================================================================
# Enthält:
# - Luft1 Tasmota Wettersensor (Schuppen)
# - OpenWeatherMap Integration Sensoren
# - Wettervorhersage Templates
# - DWD Wetterwarnungen (via REST)
# =============================================================================

# -----------------------------------------------------------------------------
# MQTT Sensoren für Luft1 - entfernt, Tasmota Discovery erstellt diese automatisch
# Entities: sensor.luft1_bmp280_temp, sensor.luft1_dht11_temp, etc.
# -----------------------------------------------------------------------------

# -----------------------------------------------------------------------------
# Template Sensoren für Wetter-Aufbereitung
# -----------------------------------------------------------------------------
template:
  - sensor:
      # Aktuelle Temperatur formatiert
      - name: "Wetter Temperatur Aktuell"
        unique_id: wetter_temp_aktuell
        state: >
          {{ state_attr('weather.forecast_home', 'temperature') | round(1) }}
        availability: >
          {{ state_attr('weather.forecast_home', 'temperature') is not none }}
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer

      # Gefühlte Temperatur
      - name: "Wetter Gefühlt"
        unique_id: wetter_gefuehlt
        state: >
          {{ state_attr('weather.forecast_home', 'apparent_temperature') | round(1) }}
        availability: >
          {{ state_attr('weather.forecast_home', 'apparent_temperature') is not none }}
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer-lines

      # Luftfeuchtigkeit
      - name: "Wetter Luftfeuchtigkeit"
        unique_id: wetter_luftfeuchtigkeit
        state: >
          {{ state_attr('weather.forecast_home', 'humidity') | round(0) }}
        availability: >
          {{ state_attr('weather.forecast_home', 'humidity') is not none }}
        unit_of_measurement: "%"
        device_class: humidity
        icon: mdi:water-percent

      # Windgeschwindigkeit
      - name: "Wetter Wind"
        unique_id: wetter_wind
        state: >
          {% set wind = state_attr('weather.forecast_home', 'wind_speed') %}
          {{ wind | round(1) if wind else 'N/A' }}
        unit_of_measurement: "km/h"
        icon: mdi:weather-windy

      # Windrichtung als Text
      - name: "Wetter Windrichtung"
        unique_id: wetter_windrichtung
        state: >
          {% set bearing = state_attr('weather.forecast_home', 'wind_bearing') %}
          {% if bearing is none %}
            N/A
          {% elif bearing >= 337.5 or bearing < 22.5 %}
            Nord
          {% elif bearing >= 22.5 and bearing < 67.5 %}
            Nordost
          {% elif bearing >= 67.5 and bearing < 112.5 %}
            Ost
          {% elif bearing >= 112.5 and bearing < 157.5 %}
            Südost
          {% elif bearing >= 157.5 and bearing < 202.5 %}
            Süd
          {% elif bearing >= 202.5 and bearing < 247.5 %}
            Südwest
          {% elif bearing >= 247.5 and bearing < 292.5 %}
            West
          {% else %}
            Nordwest
          {% endif %}
        icon: mdi:compass

      # Luftdruck
      - name: "Wetter Luftdruck"
        unique_id: wetter_luftdruck
        state: >
          {{ state_attr('weather.forecast_home', 'pressure') | round(0) }}
        availability: >
          {{ state_attr('weather.forecast_home', 'pressure') is not none }}
        unit_of_measurement: "hPa"
        device_class: pressure
        icon: mdi:gauge

      # Wetterzustand auf Deutsch
      - name: "Wetter Zustand"
        unique_id: wetter_zustand
        state: >
          {% set condition = states('weather.forecast_home') %}
          {% set mapping = {
            'clear-night': 'Klare Nacht',
            'cloudy': 'Bewölkt',
            'fog': 'Nebel',
            'hail': 'Hagel',
            'lightning': 'Gewitter',
            'lightning-rainy': 'Gewitter mit Regen',
            'partlycloudy': 'Teilweise bewölkt',
            'pouring': 'Starkregen',
            'rainy': 'Regen',
            'snowy': 'Schnee',
            'snowy-rainy': 'Schneeregen',
            'sunny': 'Sonnig',
            'windy': 'Windig',
            'windy-variant': 'Windig mit Wolken',
            'exceptional': 'Außergewöhnlich'
          } %}
          {{ mapping.get(condition, condition) }}
        icon: mdi:weather-partly-cloudy

      # UV-Index (falls verfügbar)
      - name: "Wetter UV Index"
        unique_id: wetter_uv_index
        state: >
          {{ state_attr('weather.forecast_home', 'uv_index') | round(1) }}
        availability: >
          {{ state_attr('weather.forecast_home', 'uv_index') is not none }}
        icon: mdi:weather-sunny-alert

  # -----------------------------------------------------------------------
  # Trigger-basierte Template Sensoren für Tagesvorhersage
  # (weather.get_forecasts ersetzt das alte forecast-Attribut seit HA 2024.x)
  # -----------------------------------------------------------------------
  - trigger:
      - trigger: time_pattern
        minutes: "/30"
      - trigger: homeassistant
        event: start
    action:
      - delay: "00:00:10"
      - action: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.forecast_home
        response_variable: daily
    sensor:
      - name: "Wetter Heute Max"
        unique_id: wetter_heute_max
        state: >
          {% set fc = daily['weather.forecast_home'].forecast %}
          {% if fc and fc | length > 0 %}
            {{ fc[0].temperature }}
          {% else %}
            {{ none }}
          {% endif %}
        availability: >
          {% set fc = daily['weather.forecast_home'].forecast | default([]) %}
          {{ fc | length > 0 and fc[0].temperature is defined }}
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer-chevron-up

      - name: "Wetter Heute Min"
        unique_id: wetter_heute_min
        state: >
          {% set fc = daily['weather.forecast_home'].forecast %}
          {% if fc and fc | length > 0 %}
            {{ fc[0].templow }}
          {% else %}
            {{ none }}
          {% endif %}
        availability: >
          {% set fc = daily['weather.forecast_home'].forecast | default([]) %}
          {{ fc | length > 0 and fc[0].templow is defined }}
        unit_of_measurement: "°C"
        device_class: temperature
        icon: mdi:thermometer-chevron-down

      - name: "Wetter Regenwahrscheinlichkeit"
        unique_id: wetter_regenwahrscheinlichkeit
        state: >
          {% set fc = daily['weather.forecast_home'].forecast %}
          {% if fc and fc | length > 0 %}
            {{ fc[0].precipitation_probability | default(0) }}
          {% else %}
            0
          {% endif %}
        unit_of_measurement: "%"
        icon: mdi:weather-rainy

  # Binary Sensor für Regen (trigger-basiert)
  - trigger:
      - trigger: time_pattern
        minutes: "/30"
      - trigger: homeassistant
        event: start
    action:
      - delay: "00:00:12"
      - action: weather.get_forecasts
        data:
          type: daily
        target:
          entity_id: weather.forecast_home
        response_variable: daily
    binary_sensor:
      - name: "Wetter Regen Erwartet"
        unique_id: wetter_regen_erwartet
        state: >
          {% set fc = daily['weather.forecast_home'].forecast | default([]) %}
          {% if fc | length > 0 %}
            {{ fc[0].precipitation_probability | default(0) | int > 30 }}
          {% else %}
            false
          {% endif %}
        device_class: moisture
        icon: mdi:umbrella

# -----------------------------------------------------------------------------
# Luftdruck-Trend (IceWeatherstation BME280) - steigend/fallend
# min_gradient in Einheit/Sekunde: 0.0001 entspricht ca. 1 hPa / 3h
# -----------------------------------------------------------------------------
binary_sensor:
  - platform: trend
    sensors:
      luftdruck_steigend:
        entity_id: sensor.tasmota_bme280_pressure
        sample_duration: 10800
        min_gradient: 0.0001
        max_samples: 50
      luftdruck_fallend:
        entity_id: sensor.tasmota_bme280_pressure
        sample_duration: 10800
        min_gradient: 0.0001
        max_samples: 50
        invert: true

# -----------------------------------------------------------------------------
# REST Sensoren für DWD Wetterwarnungen
# -----------------------------------------------------------------------------
rest:
  # DWD Wetterwarnungen für Region (WarnCellID muss angepasst werden)
  # WarnCellID finden: https://www.dwd.de/DE/leistungen/opendata/help/warnungen/cap_warncellids_csv.html
  - resource: "https://www.dwd.de/DWD/warnungen/warnapp/json/warnings.json"
    scan_interval: 900  # 15 Minuten
    sensor:
      - name: "DWD Wetterwarnungen Anzahl"
        unique_id: dwd_warnungen_anzahl
        value_template: >
          {% if value_json is defined and value_json is not none %}
            {% set data = value_json %}
            {% if data and 'warnings' in data %}
              {{ data.warnings | length }}
            {% else %}
              0
            {% endif %}
          {% else %}
            0
          {% endif %}
        icon: mdi:alert-circle

# -----------------------------------------------------------------------------
# Automationen für Wetterwarnungen
# -----------------------------------------------------------------------------
automation:
  - id: wetter_warnung_benachrichtigung
    alias: "Wetterwarnung Benachrichtigung"
    description: "Benachrichtigt bei neuen Wetterwarnungen"
    trigger:
      - platform: state
        entity_id: sensor.dwd_wetterwarnungen_anzahl
    condition:
      - condition: template
        value_template: "{{ trigger.to_state.state | int > trigger.from_state.state | int }}"
    action:
      - service: persistent_notification.create
        data:
          title: "Wetterwarnung"
          message: "Es gibt {{ states('sensor.dwd_wetterwarnungen_anzahl') }} aktive Wetterwarnungen vom DWD!"
          notification_id: dwd_warnung
    mode: single
