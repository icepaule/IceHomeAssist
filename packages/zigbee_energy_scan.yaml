# Zigbee Energy Scan - RF energy detection on all 16 Zigbee channels
# Shows activity from own and foreign Zigbee networks

mqtt:
  sensor:
    # Summary sensor
    - name: "Zigbee Energy Scan"
      unique_id: zigbee_energy_scan_summary
      state_topic: "homeassistant/sensor/zigbee_energy_scan/state"
      value_template: "{{ value_json.active_foreign_channels }}"
      unit_of_measurement: "channels"
      icon: "mdi:zigbee"
      json_attributes_topic: "homeassistant/sensor/zigbee_energy_scan/state"
      json_attributes_template: >-
        {{ value_json | tojson }}

    # Per-channel sensors (Zigbee channels 11-26)
    - name: "Zigbee Ch11 Energy"
      unique_id: zigbee_energy_ch11
      state_topic: "homeassistant/sensor/zigbee_energy_ch11/state"
      value_template: "{{ value_json.energy }}"
      unit_of_measurement: "%"
      icon: >-
        {% if value_json.is_own_channel %}mdi:access-point{% else %}mdi:signal{% endif %}

    - name: "Zigbee Ch12 Energy"
      unique_id: zigbee_energy_ch12
