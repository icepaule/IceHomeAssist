# =============================================================================
# THW DIENSTE - LANGZEIT-STATISTIK / VERFÜGBARKEIT
# =============================================================================
# - Uptime-Sensoren (100 = erreichbar / 0 = gestört) mit state_class measurement
#   -> erzeugen Langzeitstatistik (LTS, NICHT von purge_keep_days betroffen)
#   -> Verfügbarkeit über Wochen/Monate (apexcharts liest die LTS).
# - history_stats je Dienst: Online-Zeit und gemessene Zeit (on+off) der letzten
#   30 Tage. Verfügbarkeit% = Online / Gemessen (ignoriert Zeit ohne Messdaten,
#   daher von Tag 1 an korrekt - nicht durch das 30-Tage-Fenster verfälscht).
# Auswertung beginnt mit Aktivierung (31.05.2026) und füllt sich auf.
# =============================================================================

template:
  - sensor:
      - name: "THW Web heroesday.de Uptime"
        unique_id: thw_web_heroesday_de_uptime
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:lan-check
        state: "{{ 100 if is_state('binary_sensor.thw_web_heroesday_de','on') else 0 }}"
        availability: "{{ states('binary_sensor.thw_web_heroesday_de') in ['on','off'] }}"
